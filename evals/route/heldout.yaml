# 路由留出题（spec [2026-10-23] §20）：在改完路由例句和关键字之后新写的，没有用来调过例句、关键字或权重，
# 用来检查路由在没见过的问法上准不准。以后调路由时不要照这些题改例句，否则这套题就不再是留出题。
# 标注规则同 labels.yaml：primary 任一个当主责都算对；required 必须请到；allowed 请到也合理。
