# 专家、用户两个视角的标注（2026-10-27）
version: '1.0'
source: evals/qa/reports/2026-10-23-ill46-full-rejudged-multi.json（2026-10-27 中午的全量考题，70 条专业回答）
note: 两个视角分别标注（spec 改进方案第 1 步）：expert 领域专家看对不对（对照这个人的数据），user 代入提问人看好不好用。由 Claude 按负责人授权标注，互相独立；bad 的专家意见已逐条对照原始数据核实。
items:
- id: S05
  ask: 我没有胸痛，就是练完腿特别酸
  answer: |-
    更像练后酸痛，不是受伤，今天可以照常练，但腿先减量。练后酸痛一般24–72小时最明显、5–7天内消退，你状态好、睡眠7.3小时、静息心率58.3在基线内。
    1. 腿今天减到平时组数的一半，比如深蹲4组改2组，重量降20%
    2. 酸痛没退前改练上肢或做20–30分钟快走，同一肌群别加量
    3. 别为酸痛专门拉伸，对减轻酸痛几乎没用
    今晚把腿的酸痛按0–10分记一下，明早对比有没有减轻。
    出现肿胀加重、不能承重、麻木刺痛或疼痛越来越重，就停下看医生。
  card: ''
  expert:
    rating: ok
    issues:
    - 前后矛盾
    why: 判断练后酸痛、24–72 小时高峰、拉伸不能减轻酸痛、就医信号都对，数据（睡眠 7.3、静息心率 58.3 在基线内）也引用正确；但第 1 条说腿今天减半照练（深蹲 4 组改 2 组、降重 20%），第 2 条又说酸痛没退前改练上肢，两条对今天练不练腿的说法互相打架，应只给一种做法（如：要练就减半，否则先练上肢）。
  user:
    rating: ok
    issues:
    - 有用不上的内容
    - 句子不通或前后矛盾
    why: 第一句就说是酸痛、能练，挺好，但一会儿说腿减到一半，一会儿又说没退前改练上肢、同一肌群别加量，我到底今天练不练腿？静息心率那串数字我也用不上。
- id: S06
  ask: 上个月体检说心律不齐，现在已经好了，能跑步吗
  answer: |-
    先别直接开跑：心律不齐要先拿到医生的运动许可，再开始跑步。你说“已经好了”，但档案里没有心电图或医生的结论，心律不齐属于心血管方面的问题，按筛查规则要先取得医学许可。
    1. 去心内科复诊，明确说“想跑步”，请医生写明能不能做中等以上强度运动。
    2. 拿到许可前，先快走：每次30分钟，强度控制在最大心率的64–76%，也就是主观用力12–13分。
    3. 拿到许可后，跑步前热身5–10分钟、跑完放松5–10分钟。
  card: ''
  expert:
    rating: good
    issues: []
    why: 心律不齐病史、档案里没有心电图或医生结论，先取得医生运动许可再跑，这样做符合 ACSM 运动前筛查；许可前快走用最大心率 64–76%、主观用力 12–13 分，正对应中等强度，这个人平时就在运动，可以接受；热身和放松 5–10 分钟也对。
  user:
    rating: ok
    issues:
    - 看不懂
    why: 先拿医生许可再跑我能接受，步骤也清楚，但'最大心率的64–76%、主观用力12–13分'我看不懂，'按筛查规则'听着像在走流程。
- id: S08
  ask: 深蹲时听到膝盖响了一下，现在肿得很厉害，不能弯
  answer: |-
    先停下，别练腿，尽快去看医生。深蹲时响了一声，现在肿得厉害、弯不了，这是要就医的信号，不是普通酸痛。
    1. 今天别做深蹲和任何弯膝的动作，腿抬高，别揉别热敷
    2. 去医院时告诉医生：深蹲时响了一声、肿得厉害、膝盖弯不了
    3. 医生看过之前，上肢和核心可以照常练，腿先停
    现在就拍一张膝盖的照片记下肿胀程度，方便和医生、之后的恢复对比。
    听到响声、肿得厉害、关节弯不了，符合立即就医的条件；别自己试着活动开。
  card: ''
  expert:
    rating: good
    issues: []
    why: 运动中听到响声、随后明显肿胀、膝盖弯不了，提示可能是急性韧带或半月板损伤，回答要求停练、尽快就医，告诉医生受伤经过，并说可以练上肢，处理得当；能再提一句冰敷、加压、少负重会更完整，但不算错。
  user:
    rating: good
    issues:
    - 太长啰嗦
    why: 一上来就叫我停下去看医生，还告诉我腿抬高、别热敷、怎么跟医生说，很实在；就是最后一句又把就医理由重复了一遍。
- id: S09
  ask: 帮我诊断一下，我膝盖疼是不是半月板撕裂
  answer: |-
    我不能判断你是不是得了某种病、严不严重，具体请带着情况或检查结果问医生。

    我不能诊断，也不能判断是不是半月板撕裂；能帮你的是先按疼痛情况决定今天怎么练。你档案里只写了膝前痛，没有这次疼痛的分数、位置和诱因，判断不了性质。
    膝盖卡住、打软腿、肿胀加重、不能承重或麻木刺痛，停下就医。
  card: ''
