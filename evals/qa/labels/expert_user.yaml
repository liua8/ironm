    why: 髋铰链练习、起拉前预紧杠铃、蹬地、杠铃贴腿、锁定时夹臀不后仰等要点正确。但开头武断断定“你是用腰往后仰把杠铃拽起来的”，最常见的腰代偿是起拉时腰椎弯曲、臀部先抬，回答只顺带提到；也没建议先减重量再练动作。
