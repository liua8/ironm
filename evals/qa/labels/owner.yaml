    ask: 早餐吃什么比较好
    answer: |-
      你 10 月 21 日测的血压是 186/114 mmHg，已经很高：先别运动，尽快就医；如果有胸痛、剧烈头痛、视物模糊、说话不清，立即拨打 120。

      早餐按增肌目标吃：全天热量约 2896 千卡、蛋白质 120–150 克，早餐占 600–700 千卡、蛋白质 30–40 克最合适。具体这么搭（三选一，都买得到）：
      1. 2 个鸡蛋 + 250 毫升牛奶 + 1 个馒头（约 100 克）+ 一小把坚果；2. 燕麦 60 克用牛奶 300 毫升冲 + 1 个鸡蛋 + 1 根香蕉；3. 食堂或外卖：瘦肉粥或豆浆 400 毫升 + 鸡蛋 2 个 + 全麦面包 2 片 + 一份凉拌菜。要点：蛋白质集中在早餐，别只吃碳水；牛奶、鸡蛋、豆浆任选两样凑够 30 克蛋白，每餐 20–40 克高质量蛋白、每 3–4 小时一次。全天蔬菜不少于 300 克、奶 300–500 克，早餐先占一部分。最后提醒：先按医生意见处理，饮食上同时把盐控制在每天 5 克以内，腌菜、咸蛋、加工肉早餐先别吃。
