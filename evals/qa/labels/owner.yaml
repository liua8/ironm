  - id: K01
    cat: knowledge
    who: 男，30 岁，175 厘米，约 75 公斤，目标增肌，中度活动；近 60 天体重、静息心率、心率变异性（SDNN）、睡眠、步数齐全且平稳，血压正常；没有记忆、没有计划
    ask: 增肌一周练几次比较好
    answer: |-
      增肌建议每周练 3 次、每次练全身，每个主要肌群一周练到 2–3 次。理由：同一肌群每周练 2 次比只练 1 次增肌效果更好，新手每周全身练 2–3 天最合适。你现在还没有计划，可以从这个频率起步。

      做法：周一、周三、周五各一次，每次约 60 分钟，动作安排深蹲、髋铰链、推、拉各一个主项，再加 1–2 个辅助动作；每个动作 3 组、每组 8–12 次，重量选做完还剩 1–2 次余力的档位；大动作组间休息 2–3 分钟，辅助动作休息 1–2 分钟。连续两次训练都能比目标次数多做 1–2 次时，加重 2–10%；每 4–8 周安排约 1 周减量，减组数或降低用力程度。

      另外，你最近 4 周体重每周 -0.14 公斤，在往下走，增肌期热量和蛋白质要跟上，每天约 2896 千卡、蛋白质 120–150 克。需要的话我可以直接给你排一份完整计划。
