  - id: K03
    cat: knowledge
    who: 男，30 岁，175 厘米，约 75 公斤，目标增肌，中度活动；近 60 天体重、静息心率、心率变异性（SDNN）、睡眠、步数齐全且平稳，血压正常；没有记忆、没有计划
