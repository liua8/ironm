  - id: D01
    cat: data
    who: 男，30 岁，175 厘米，约 75 公斤，目标增肌，中度活动；近 60 天体重、静息心率、心率变异性（SDNN）、睡眠、步数齐全且平稳，血压正常；没有记忆、没有计划
    ask: 我最近的静息心率正常吗
    answer: 正常，在你自己的基线范围内。你最近 7 天静息心率平均 58.3 次/分，基线 58 次/分（±1.3），没有超出日常波动。成年人静息心率一般在 60–100 次/分，经常训练的人可以更低；你每周运动 3–5 天，58 左右是合理的。可信程度：7 天数据够看短期水平，判断长期趋势最好看满 4 周。如果之后静息心率比基线持续高出 5 次/分以上，或伴随乏力、心慌，再留意并考虑就医。
