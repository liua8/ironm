  # ---- 该追问与不该追问 ----
  - id: Q01
    cat: clarify
    persona: newbie
    ask: 帮我做个训练计划
    path: clarify
    asks: true
    must: [你定, [几天, 每周, 一周], [器械, 在家, 健身房]]
    max_chars: 160
  - id: Q02
    cat: clarify
    persona: newbie
    history:
      - user: 帮我做个训练计划
        coach: 先确认两件事，好给你排得准：①你一周能练几天、每次大概多久？②在家还是健身房，手边有什么器械？也可以直接说「你定」，我先按每周 3 天、每次 45 分钟、徒手加哑铃来排。
    ask: 你定吧
    path: answer
    roles: [trainer]
    must: [[默认, 先按, 按每周 3, 每周 3 天, 每周三天, 一周三]]
    must_not: [你一周能练几天]
  - id: Q03
    cat: clarify
    persona: knee
    ask: 帮我做个训练计划
    path: answer
    roles: [trainer]
    must: [哑铃]
    must_not: [你一周能练几天]
