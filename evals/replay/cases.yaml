# 重放清单（spec [2026-10-23] §62 需求 1 及 10-29 修改）：负责人反馈过的会话，按清单在本机服务上用重放账号逐条跑真实模型。
#
# 每条开始前清空重放账号的 iron-m 数据，再按 setup 准备状态；turns 依次说的话和期望：
#   must      每组几种说法任一出现即可，每组都要满足（只看回答正文）
#   must_not  都不能出现
#   card      plan / log / none：这一轮出不出预览卡片、是哪种；不写就不检查
#   illness   这一轮之后重放账号有几条生病记录；不写就不检查
#   asks      这一轮最多问几个问题（按问号数）；不写就不检查
# 只用规则判断，不打分。

profile: {height_cm: 175, birth: "1995-06-01", sex: male, goal: fat_loss, activity: moderate}

cases:
  - id: checked-in-today
    from: §52 打卡后问今天、"这算加练吗"
    setup: {checkin: {session: 骑车有氧, minutes: 30, rpe: 7}}
    turns:
      - say: 我今天计划怎么样
        must: [[已经练完, 已打卡, 打卡了, 练完了, 已经完成, 完成了]]
        must_not: [今天再骑, 今天骑 30, 今天练 30]
        card: none
      - say: 这算加练吗
        must: [[不算]]
        card: none

  - id: new-plan-confirm
    from: §55 要新计划、"按这个排"
    turns:
      - say: 我想要更好的减重，给我一份计划吗
        must: [[目标], [器械], [时间], [伤病], [按这个排]]
        card: none
      - say: 按这个排
        card: plan

  - id: preview-not-ok
    from: §56 预览后"不太行"
    turns:
      - say: 给我一份训练计划
        card: none
      - say: 按这个排
        card: plan
      - say: 不太行
        must: [[哪里, 哪一, 哪些, 哪个]]
        must_not: [打卡]
        card: none

  - id: equipment-then-not-good
    from: 负责人 10-27 那段会话：要计划 → 问器械 → 说健身房和器械 → "都不好"
    turns:
      - say: 帮我排一个训练计划
        must: [[器械]]
        card: none
      - say: 我在健身房练，有杠铃、哑铃、龙门架和史密斯机
        card: plan
      - say: 都不好
        must: [[哪里, 哪一, 哪些, 哪个, 哪儿]]
        must_not: [这次没能]
        card: none

  - id: sick-same-day
    from: §46 生病（换成同一天）、§50 问病情不算又病了、"不疼啊"算好了
    turns:
      - say: 肚子疼，今天能练吗
        must: [[休息, 先别练, 不练, 别练]]
        card: none
        illness: 1
      - say: 我肚子疼不疼
        card: none
        illness: 1
      - say: 今天肚子不疼啊
        must: [[好了, 不疼了, 恢复, 好转]]
        card: none
        illness: 1
      - say: 那今天练什么
        must_not: [肚子还疼, 还没好, 还在疼]  # "肚子疼刚好、病后第一次按七成"是对的（§46）
        card: none

  - id: i-am-sick
    from: §68 "我病了"这一轮要记下来
    turns:
      - say: 我病了
        must: [[休息, 别练, 不练]]  # 这一轮要记下来、今天不练（§68）；追问症状 spec 没要求
        card: none
      - say: 发烧了，38 度
        must: [[休息, 不练, 先别, 别练]]
        card: none
        illness: 1
      - say: 今天能练吗
        must: [[不练, 休息, 先别, 别练, 不要练]]
        card: none

  - id: memory-layers
    from: §73 记忆四层：出差说 3 遍只有一条；答应的事；换会话接上
    turns:
      - say: 这周出差，只能在酒店房间练
        events: 1
      - say: 出差延长到周日了
        events: 1
      - say: 出差只有自重，周四怎么练
        must: [[自重, 俯卧撑, 深蹲, 臀桥]]
        events: 1
      - say: 好的，下周你再问问我膝盖还疼不疼
        must: [[下周, 问]]
      - say: 上次我们聊到哪了
        new_session: true
        pause: 25
        must: [[出差]]

  - id: intake-new-user
    from: §76 新用户说要开始练：先做安全筛查，每轮最多问 2 个
    turns:
      - say: 我想开始健身，从哪开始
        must: [[运动, 练], [心脏, 血压, 胸, 病, 吃药, 药]]
        must_not: [第一周, 周一, 组数]
        asks: 2
        card: none
      - say: 最近没怎么运动，也没什么病
        must: [[胸, 头晕, 喘, 气短, 旧伤, 疼]]
        asks: 2
        card: none
      - say: 爬楼的时候胸口会发闷，歇一下就好
        must: [[医生]]
        must_not: [第一周, 组数]
        card: none

  - id: plan-from-library
    from: §77 零基础、每周 3 天健身房要计划：先确认条件，再从方案库排全身计划
    turns:
      - say: 我刚开始练，一周能去健身房 3 次，每次一小时，帮我排个计划
        card: none
      - say: 按这个排
        must: [[3 次, 三次], [全身, 力量]]
        must_not: [每周 5, 每周 6, 4 组, 5 组]
        card: plan

  - id: skills-batch-3-5
    from: §81 新规程：伤痛、生病、补剂、化验各问一句，第一句就是答案，守住安全底线
    turns:
      - say: 深蹲蹲到底膝盖前面有点疼，3 分，还能练吗
        must: [[能练, 可以练, 先], [5 分, 医生, 就医]]
        must_not: [半月板, 髌骨软化]
        card: none
      - say: 发烧 38 度，能不能出出汗
        must: [[不能, 不要, 别]]
        must_not: [出出汗就好]
        card: none
      - say: BCAA 要不要买
        must: [[不用, 不必, 没必要]]
        card: none
      - say: 我尿酸偏高严重吗
        must: [[没有找到, 没找到, 没有记录, 没查到]]
        must_not: [痛风]
        card: none

  - id: unwell-light-request
    from: §82 只说不舒服时先接住请求；不报日期、不按发烧安排、不重复叮嘱、没有内部编号
    turns:
      - say: 今天有点不舒服
        must: [[哪里, 怎么了, 什么症状]]
        must_not: [慢走, 拉伸, 骑车, 分钟, 〔]
        card: none
      - say: 今天有点不舒服，给我安排一个轻松的锻炼
        must: [[可以, 能, 好], [哪里不舒服, 哪不舒服, 什么症状, 哪儿不舒服]]
        must_not: [今天不练, 量体温, 退烧, 月 30 日, 还没好, 〔]
        card: none
      - say: 今天有点累
        must_not: [〔, 月 30 日]
        card: none
      - say: 嗓子有点疼，能练吗
        must: [[可以, 能]]
        must_not: [〔, 不能练]
        card: none

  - id: how-many-plans
    from: §83 问有多少训练计划：说清自己用的哪份、方案库几份、在训练计划榜看
    turns:
      - say: 你们有多少训练计划
        must: [[12, 十二], [训练计划榜, 排行榜, 夯]]
        must_not: [〔]
        card: none

  - id: read-trends
    from: §84 读懂指标：两种比、可能的原因、已经做的调整；追问依据讲得出来
    turns:
      - say: 我最近静息心率怎么样
        must: [[平常, 平时, 基线, 自己], [60–100, 正常范围, 标准]]
        must_not: [〔]
        card: none
      - say: 为什么这么调，依据是什么
        must_not: [〔]
        card: none
