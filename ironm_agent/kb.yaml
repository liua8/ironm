# 依据库（首批）。只收公开可得的资料（教材类注明），摘要与要点用自己的话写，不复制原文。
# review: claude_draft = Claude 依据对这些公开资料的了解撰写，尚未逐条对照原文核实；
#         approved     = 已对照原文核实并在审定记录里登记。
# 领域：training 训练、exercise 动作、nutrition 营养、recovery 恢复、safety 安全、data 指标解读
version: "0.1"

entries:
  - id: K01
    domains: [training, data]
    title: 成年人每周身体活动推荐量
    source: WHO guidelines on physical activity and sedentary behaviour
    publisher: 世界卫生组织
    year: 2020
    level: guideline
    population: 18–64 岁成年人（65 岁以上另有平衡与多成分训练建议）
    summary: 有氧活动按每周总时长计，力量练习按每周天数计；久坐越少越好，任何强度的活动都比坐着好。
    points:
      - text: 成年人每周进行 150–300 分钟中等强度有氧活动，或 75–150 分钟高强度有氧活动，或两者的等量组合。
        where: Recommendations — Adults (aged 18–64 years)
      - text: 每周至少 2 天进行中等或更高强度、涉及全身主要肌群的肌肉力量练习。
        where: Recommendations — Adults (aged 18–64 years)
      - text: 中等强度有氧超过 300 分钟或高强度超过 150 分钟，可以获得额外的健康益处。
        where: Recommendations — Adults (aged 18–64 years)
      - text: 65 岁及以上的人每周至少 3 天做强调平衡和力量的多成分身体活动，以预防跌倒。
        where: Recommendations — Older adults (aged 65 years and older)
    keywords: [每周, 多少运动, 有氧, 运动量, 久坐, 一周练]
    url: https://www.who.int/publications/i/item/9789240015128
    review: claude_draft

  - id: K02
    domains: [training, data]
    title: 中国成年人身体活动推荐
    source: 中国人群身体活动指南（2021）
    publisher: 国家卫生健康委疾病预防控制局、中国疾病预防控制中心
    year: 2021
    level: guideline
    population: 18–64 岁成年人
    summary: 与世界卫生组织的推荐一致：有氧按每周总时长，力量练习每周至少 2 天，并鼓励增加日常活动。
    points:
      - text: 成年人每周进行 150–300 分钟中等强度或 75–150 分钟高强度有氧活动，或等量的组合。
        where: 成年人身体活动推荐，第 1 条
      - text: 成年人每周至少进行 2 天肌肉力量练习。
        where: 成年人身体活动推荐，第 2 条
      - text: 保持日常身体活动，并增加活动量。
        where: 成年人身体活动推荐，第 3 条
    keywords: [每周, 运动量, 有氧, 力量练习]
    review: claude_draft

  - id: K03
    domains: [training]
    title: 力量训练的负荷、组数、频率与进阶（健康成年人）
    source: Progression Models in Resistance Training for Healthy Adults（Med Sci Sports Exerc 41(3):687–708）
    publisher: 美国运动医学会（ACSM）
    year: 2009
    level: position_stand
    population: 健康成年人，新手到有经验者
    summary: 新手用中等负荷、较多次数、少量组数，每周全身练 2–3 次；能稳定多做 1–2 次时再小幅加重。增肌以 6–12 次的范围为主。
    points:
      - text: 新手采用约 60–70% 最大重量（1RM）的负荷，每组 8–12 次，1–3 组。
        where: Novice training — loading and volume
      - text: 新手每周训练 2–3 天（全身）；中级 3–4 天；高级 4–5 天。
        where: Frequency
      - text: 当能连续两次训练都比目标次数多做 1–2 次时，负荷增加 2–10%。
        where: Progression — load
      - text: 以增肌为目标时，新手和中级者用 70–85% 1RM、8–12 次、1–3 组；高级者以 6–12 次为主，3–6 组。
        where: Muscular hypertrophy
      - text: 大重量的多关节主要动作，组间休息至少 2–3 分钟；辅助动作 1–2 分钟。
        where: Rest periods
    keywords: [组数, 次数, 重量, 加重, 增肌, 力量, 新手, 休息多久, 一周几次]
    url: https://journals.lww.com/acsm-msse/fulltext/2009/03000/progression_models_in_resistance_training_for.26.aspx
    review: claude_draft

  - id: K04
    domains: [training]
    title: 每周训练量与增肌的关系
    source: Dose-response relationship between weekly resistance training volume and increases in muscle mass（J Sports Sci 35(11):1073–1082）
    publisher: Schoenfeld、Ogborn、Krieger
    year: 2017
    level: systematic_review
    population: 进行抗阻训练的成年人
    summary: 每个肌群每周的组数越多，增肌效果越好，呈剂量—效应关系；每周 10 组以上明显好于不足 5 组。
    points:
      - text: 每个肌群每周 10 组及以上的增肌效果，好于每周不足 5 组。
        where: Results — weekly sets categories
      - text: 每周每多做一组，增肌效应量随之增加。
        where: Results — dose-response
    keywords: [训练量, 组数, 增肌, 每周多少组]
    review: claude_draft

  - id: K05
    domains: [training]
    title: 每个肌群每周练几次
    source: Effects of Resistance Training Frequency on Measures of Muscle Hypertrophy（Sports Med 46(11):1689–1697）
    publisher: Schoenfeld、Ogborn、Krieger
    year: 2016
    level: systematic_review
    population: 进行抗阻训练的成年人
    summary: 同一肌群每周练 2 次，增肌效果好于每周 1 次。
    points:
      - text: 主要肌群每周至少训练 2 次，增肌效果好于每周 1 次。
        where: Conclusions
    keywords: [频率, 一周练几次, 分化, 全身]
    review: claude_draft

  - id: K06
    domains: [training, recovery, data]
    title: 有氧运动强度怎么分、热身与放松
    source: Quantity and Quality of Exercise for Developing and Maintaining Fitness in Apparently Healthy Adults（Med Sci Sports Exerc 43(7):1334–1359）
    publisher: 美国运动医学会（ACSM），Garber 等
    year: 2011
    level: position_stand
    population: 表面健康的成年人
    summary: 用最大心率百分比或主观用力程度划分强度；每次训练前后各有热身和放松；柔韧练习每周 2–3 天。
    points:
      - text: 中等强度约为最大心率的 64–76%，主观用力程度（6–20 分）12–13 分；高强度约为最大心率的 77–95%，14–17 分。
        where: Table — Classification of exercise intensity
      - text: 每次训练包括至少 5–10 分钟低到中等强度的热身，结束时至少 5–10 分钟的放松。
        where: Components of the exercise training session
      - text: 柔韧练习每周至少 2–3 天，每个静态拉伸保持 10–30 秒，每个动作累计约 60 秒。
        where: Flexibility exercise
    keywords: [心率区间, 强度, 有氧, 跑步, 热身, 拉伸, 放松]
    url: https://journals.lww.com/acsm-msse/fulltext/2011/07000/quantity_and_quality_of_exercise_for_developing.26.aspx
    review: claude_draft

  - id: K07
    domains: [recovery]
    title: 成年人每晚睡多久
    source: Recommended Amount of Sleep for a Healthy Adult（Sleep 38(6):843–844）
    publisher: 美国睡眠医学会（AASM）与睡眠研究会（SRS），Watson 等
    year: 2015
    level: consensus
    population: 18–60 岁成年人
    summary: 成年人应规律地每晚睡 7 小时及以上；长期少于 7 小时与多种健康问题相关。
    points:
      - text: 成年人应规律地每晚睡 7 小时或更多。
        where: Recommendation
      - text: 规律睡眠不足 7 小时，与体重增加、心血管疾病、情绪低落、表现下降等风险增加相关。
        where: Recommendation — rationale
    keywords: [睡眠, 睡多久, 失眠, 熬夜, 睡不够, 睡得, 睡不好, 睡不着]
    review: claude_draft

  - id: K08
    domains: [recovery, exercise]
    title: 延迟性肌肉酸痛（练后酸痛）
    source: Delayed Onset Muscle Soreness — Treatment Strategies and Performance Factors（Sports Med 33(2):145–164）
    publisher: Cheung、Hume、Maxwell
    year: 2003
    level: review
    population: 运动人群
    summary: 不熟悉或离心为主的训练后常见的酸痛，一两天后最明显，通常一周内自行缓解；轻度活动可以减轻不适，但要和受伤区分开。
    points:
      - text: 练后酸痛一般在训练后 24 小时左右出现，24–72 小时最明显，5–7 天内消退。
        where: Introduction / Symptoms
      - text: 酸痛期间肌肉力量和关节活动范围可能暂时下降，同一肌群宜减少强度。
        where: Performance factors
      - text: 轻度活动是缓解酸痛最有效的方法之一，但效果是暂时的。
        where: Treatment strategies — exercise
    keywords: [酸痛, 练后酸, 肌肉酸, 延迟性]
    review: claude_draft

  - id: K09
    domains: [nutrition]
    title: 运动人群的蛋白质需要量与分配
    source: International Society of Sports Nutrition Position Stand — Protein and Exercise（J Int Soc Sports Nutr 14:20）
    publisher: 国际运动营养学会（ISSN），Jäger 等
    year: 2017
    level: position_stand
    population: 规律运动的健康成年人
    summary: 多数运动人群每天每公斤体重 1.4–2.0 克蛋白质就够；分到几餐吃，每餐 20–40 克；热量不足的减脂期可以更高。
    points:
      - text: 多数运动人群每天蛋白质摄入 1.4–2.0 克/公斤体重即可满足需要。
        where: Position statement, point 2
      - text: 每餐约 0.25 克/公斤体重（约 20–40 克）高质量蛋白，每 3–4 小时一次，分布全天。
        where: Position statement, points 4–5
      - text: 有抗阻训练习惯的人在热量不足时，2.3–3.1 克/公斤去脂体重的更高蛋白质摄入可能有助于保留肌肉。
        where: Position statement, point 8
    keywords: [蛋白质, 蛋白粉, 吃多少蛋白, 增肌饮食]
    url: https://jissn.biomedcentral.com/articles/10.1186/s12970-017-0177-8
    review: claude_draft

  - id: K10
    domains: [nutrition]
    title: 肌酸怎么吃、安不安全
    source: International Society of Sports Nutrition position stand — safety and efficacy of creatine supplementation（J Int Soc Sports Nutr 14:18）
    publisher: 国际运动营养学会（ISSN），Kreider 等
    year: 2017
    level: position_stand
    population: 健康成年人
    summary: 一水肌酸是证据最充分的形式。可以先冲击再维持，也可以直接小剂量每天吃，只是起效慢一些；健康人短期和长期使用都安全，体重可能因水分略增。
    points:
      - text: 一水肌酸是最有效、研究最多的形式。
        where: Position statement, point 1
      - text: 冲击法：每天约 0.3 克/公斤体重（约 5 克一次、每天 4 次）连续 5–7 天，之后每天 3–5 克维持。
        where: Position statement — dosing
      - text: 不冲击时每天 3–5 克，大约 3–4 周后肌肉中的肌酸达到同样的饱和水平。
        where: Position statement — dosing
      - text: 健康人群在推荐剂量下短期和长期补充都安全、耐受良好；常见变化是体内水分增加导致体重略升。
        where: Position statement — safety
    keywords: [肌酸, 补剂, 冲击, 一水肌酸]
    url: https://jissn.biomedcentral.com/articles/10.1186/s12970-017-0173-z
    review: claude_draft

  - id: K11
    domains: [nutrition]
    title: 咖啡因与运动表现
    source: International society of sports nutrition position stand — caffeine and exercise performance（J Int Soc Sports Nutr 18:1）
    publisher: 国际运动营养学会（ISSN），Guest 等
    year: 2021
    level: position_stand
    population: 健康成年人
    summary: 适量咖啡因能提高多种运动表现；常用剂量按体重算，运动前约 1 小时服用；剂量过高副作用明显增加，个体差异大。
    points:
      - text: 常用有效剂量为 3–6 毫克/公斤体重，运动前约 60 分钟服用。
        where: Position statement, point 2
      - text: 低至 2 毫克/公斤的剂量也可能有效；9 毫克/公斤左右的高剂量副作用发生率高。
        where: Position statement, points 3 and 8
      - text: 对咖啡因的反应个体差异很大，与遗传、习惯摄入量等有关。
        where: Position statement, point 7
    keywords: [咖啡因, 咖啡, 运动前, 提神, 补剂]
    url: https://jissn.biomedcentral.com/articles/10.1186/s12970-020-00383-4
    review: claude_draft

  - id: K12
    domains: [nutrition, safety]
    title: 运动中的补水
    source: American College of Sports Medicine position stand — Exercise and fluid replacement（Med Sci Sports Exerc 39(2):377–390）
    publisher: 美国运动医学会（ACSM），Sawka 等
    year: 2007
    level: position_stand
    population: 运动人群
    summary: 补水的目标是避免运动中脱水过多，也避免喝过量；运动前提前补水，运动中按出汗量补。
    points:
      - text: 运动中避免因失水导致体重下降超过 2%。
        where: Recommendations — during exercise
      - text: 运动前至少 4 小时，缓慢饮水约 5–7 毫升/公斤体重。
        where: Recommendations — before exercise
      - text: 喝水超过出汗量会有低钠血症的风险，不宜过量饮水。
        where: Recommendations — hyponatremia
    keywords: [喝水, 补水, 出汗, 脱水, 电解质]
    url: https://journals.lww.com/acsm-msse/fulltext/2007/02000/exercise_and_fluid_replacement.22.aspx
    review: claude_draft

  - id: K13
    domains: [safety, recovery]
    title: 高温下运动与中暑
    source: ACSM Expert Consensus Statement on Exertional Heat Illness（Curr Sports Med Rep 22(4):134–149）
    publisher: 美国运动医学会（ACSM），Roberts 等
    year: 2023
    level: consensus
    population: 运动人群
    summary: 热环境下要逐步适应、降低强度、增加休息与补水；运动性热射病是急症，出现意识异常要立即降温并呼叫急救。
    points:
      - text: 运动性热射病是医疗急症，特点是体温过高并伴有意识或行为异常（如意识混乱、说胡话、昏倒）。
        where: Exertional heat stroke — definition
      - text: 处理原则是"先降温、后转运"，尽快全身冷水浸泡降温。
        where: Treatment — cool first, transport second
      - text: 在热环境中训练需要约 1–2 周逐步适应，并据环境调整强度与时长。
        where: Prevention — heat acclimatization
    keywords: [中暑, 高温, 天气热, 热射病, 夏天]
    review: claude_draft

  - id: K14
    domains: [safety]
    title: 开始运动前需要先看医生的情况
    source: Updating ACSM's Recommendations for Exercise Preparticipation Health Screening（Med Sci Sports Exerc 47(11):2473–2479）
    publisher: 美国运动医学会（ACSM），Riebe 等
    year: 2015
    level: consensus
    population: 准备开始或加大运动的成年人
    summary: 筛查看三件事：现在是否规律运动、是否有心血管/代谢/肾脏疾病、是否有相关症状；有疾病或症状的人在进行中等以上强度运动前先取得医学许可。
    points:
      - text: 有已知心血管、代谢或肾脏疾病，或出现提示这些疾病的症状时，开始或加大到中等以上强度运动前应先取得医学许可。
        where: Preparticipation screening algorithm
      - text: 运动中出现胸痛、气短、头晕晕厥等症状，应停止运动并就医评估。
        where: Signs and symptoms
    keywords: [体检, 心脏病, 高血压, 糖尿病, 肾病, 能不能运动, 筛查]
    review: claude_draft

  - id: K15
    domains: [safety, recovery, exercise]
    title: 运动受伤后什么时候要看医生
    source: Sports injuries
    publisher: 英国国家医疗服务体系（NHS）
    year: 2023
    level: health_info
    population: 一般人群
    summary: 轻微扭伤拉伤可以先自行处理几天；疼痛严重或加重、肿胀加重、麻木刺痛、不能承重或关节变形时要就医。
    points:
      - text: 自行处理几天仍不见好转、疼痛严重或越来越重、肿胀加重时，应去看医生。
        where: Non-urgent advice — see a GP if
      - text: 听到断裂声、受伤部位变形、不能活动或承重、出现麻木或刺痛时，应立即就医。
        where: Urgent advice — go to A&E if
    keywords: [受伤, 扭伤, 拉伤, 疼, 痛, 肿, 就医, 看医生]
    url: https://www.nhs.uk/conditions/sports-injuries/
    review: claude_draft

  - id: K16
    domains: [nutrition, data]
    title: 减重的合理速度
    source: Losing Weight
    publisher: 美国疾病预防控制中心（CDC）
    year: 2023
    level: health_info
    population: 想减重的成年人
    summary: 缓慢稳定地减重更容易长期保持，约每周 0.5–1 公斤。
    points:
      - text: 每周减重约 1–2 磅（约 0.5–0.9 公斤）的人，更容易长期保持减重成果。
        where: Losing Weight — Even modest weight loss can mean big benefits
    keywords: [减重, 减脂, 一周瘦多少, 掉秤, 减肥]
    url: https://www.cdc.gov/healthy-weight-growth/losing-weight/index.html
    review: claude_draft

  - id: K17
    domains: [nutrition]
    title: 中国居民平衡膳食准则与每日食物量
    source: 中国居民膳食指南（2022）
    publisher: 中国营养学会
    year: 2022
    level: guideline
    population: 2 岁以上健康人群
    summary: 食物多样、吃动平衡；多吃蔬果奶类全谷大豆，适量鱼禽蛋瘦肉，少盐少油控糖限酒，足量饮水。
    points:
      - text: 每天蔬菜不少于 300 克（深色蔬菜占一半），水果 200–350 克，奶及奶制品 300–500 克。
        where: 准则三
      - text: 鱼、禽、蛋和瘦肉平均每天 120–200 克，每周至少吃 2 次水产品，每天一个鸡蛋。
        where: 准则四
      - text: 成年人每天食盐不超过 5 克，烹调油 25–30 克，添加糖不超过 50 克、最好控制在 25 克以下。
        where: 准则五
      - text: 成年人每天饮水 1500–1700 毫升（女性 1500、男性 1700），首选白水。
        where: 准则六
      - text: 每天谷类 200–300 克，其中全谷物和杂豆 50–150 克。
        where: 准则一
    keywords: [饮食, 吃什么, 蔬菜, 水果, 盐, 油, 糖, 喝水, 主食, 膳食]
    url: http://dg.cnsoc.org/
    review: claude_draft

  - id: K18
    domains: [recovery, data]
    title: 心率变异性怎么看：和自己比、看一周的平均
    source: Training Adaptation and Heart Rate Variability in Elite Endurance Athletes（Sports Med 43(9):773–781）
    publisher: Plews 等
    year: 2013
    level: review
    population: 耐力运动人群（方法可供一般运动人群参考）
    summary: 单天的心率变异性波动很大，应在固定条件下（如晨起）测，用约一周的滚动平均和自己的基线比较，而不是看某一天的数值或和别人比。
    points:
      - text: 用 7 天滚动平均来看心率变异性的变化，比看单日数值更可靠。
        where: Monitoring — rolling averages
      - text: 应与个人基线比较；持续明显低于自己的基线可能提示疲劳或恢复不足。
        where: Interpretation
    keywords: [心率变异性, hrv, 恢复, 疲劳]
    review: claude_draft

  - id: K19
    domains: [data, recovery]
    title: 心率变异性的不同指标不能混比
    source: An Overview of Heart Rate Variability Metrics and Norms（Front Public Health 5:258）
    publisher: Shaffer、Ginsberg
    year: 2017
    level: review
    population: 一般人群
    summary: SDNN 与 RMSSD 是两个不同的心率变异性指标，反映的生理意义和正常范围不同，数值不能直接比较。
    points:
      - text: SDNN 反映整体变异性，RMSSD 主要反映副交感（迷走）神经的影响，两者不能互相替代。
        where: Time-domain measurements
      - text: 测量时长和条件不同，得到的数值不可比。
        where: Recording period
    keywords: [sdnn, rmssd, 心率变异性, 苹果手表, 不同设备]
    url: https://www.frontiersin.org/articles/10.3389/fpubh.2017.00258/full
    review: claude_draft

  - id: K20
    domains: [data, recovery]
    title: 静息心率的正常范围
    source: All About Heart Rate (Pulse)
    publisher: 美国心脏协会（AHA）
    year: 2024
    level: health_info
    population: 成年人
    summary: 成年人静息心率一般在每分钟 60–100 次；经常训练的人可以更低。
    points:
      - text: 成年人的正常静息心率为每分钟 60–100 次。
        where: What's a normal resting heart rate?
      - text: 训练有素的运动员静息心率可能低至每分钟 40 次左右。
        where: What's a normal resting heart rate?
    keywords: [静息心率, 心率, 脉搏]
    url: https://www.heart.org/en/health-topics/high-blood-pressure/the-facts-about-high-blood-pressure/all-about-heart-rate-pulse
    review: claude_draft

  - id: K21
    domains: [data, training]
    title: 每天走多少步
    source: Daily steps and all-cause mortality — a meta-analysis of 15 international cohorts（Lancet Public Health 7(3):e219–e228）
    publisher: Paluch 等
    year: 2022
    level: systematic_review
    population: 成年人
    summary: 每天步数越多，全因死亡风险越低，到一定步数后收益趋于平稳，且平稳点随年龄不同。
    points:
      - text: 60 岁及以上的人，收益大约在每天 6000–8000 步趋于平稳。
        where: Findings
      - text: 60 岁以下的人，收益大约在每天 8000–10000 步趋于平稳。
        where: Findings
    keywords: [步数, 走路, 一天走多少, 日行]
    review: claude_draft

  - id: K22
    domains: [recovery, safety, training]
    title: 过度训练：表现、预防与何时就医
    source: Prevention, diagnosis and treatment of the overtraining syndrome（Med Sci Sports Exerc 45(1):186–205）
    publisher: 欧洲运动科学学会与美国运动医学会联合共识，Meeusen 等
    year: 2013
    level: consensus
    population: 运动人群
    summary: 休息后成绩仍持续下降，伴随长期疲劳、情绪和睡眠问题时，要考虑训练与恢复失衡；预防靠合理安排负荷与恢复，诊断前要先排除其他疾病。
    points:
      - text: 过度训练的核心表现是充分休息后运动表现仍持续下降，常伴疲劳、情绪改变和睡眠障碍。
        where: Definition and symptoms
      - text: 预防措施包括循序渐进地加量、保证恢复、记录训练和状态、避免单调的训练安排。
        where: Prevention
      - text: 判断为过度训练前，需要医生排除贫血、感染、甲状腺问题等其他原因。
        where: Diagnosis
    keywords: [过度训练, 一直很累, 成绩下降, 练不动, 减量]
    review: claude_draft

  - id: K23
    domains: [safety, recovery]
    title: 生病时还能不能运动
    source: Exercise and illness — Is it OK to exercise if I'm sick?
    publisher: 梅奥诊所（Mayo Clinic）
    year: 2024
    level: health_info
    population: 一般成年人
    summary: 只有流涕、鼻塞、轻微咽痛等"颈部以上"的症状时，可以降低强度适当活动；发烧、全身酸痛、胸闷咳嗽、腹泻等时应当休息。这是经验性建议，证据等级不高。
    points:
      - text: 症状只在颈部以上（流涕、鼻塞、打喷嚏、轻微咽痛）时，通常可以降低强度活动。
        where: Above-the-neck symptoms
      - text: 发烧、乏力、全身肌肉酸痛，或胸闷、咳嗽、胃肠不适等颈部以下症状时，不宜运动。
        where: Below-the-neck symptoms
    keywords: [感冒, 发烧, 生病, 咳嗽, 嗓子疼]
    review: claude_draft

  - id: K24
    domains: [safety]
    title: 孕期运动与需要立即停止的信号
    source: Physical Activity and Exercise During Pregnancy and the Postpartum Period（ACOG Committee Opinion No. 804）
    publisher: 美国妇产科医师学会（ACOG）
    year: 2020
    level: guideline
    population: 无并发症的孕妇与产后女性
    summary: 无并发症的孕妇可以并且应当规律运动，但要在产检医生同意下进行，并知道哪些信号出现时必须停止。
    points:
      - text: 无并发症的孕妇每周进行至少 150 分钟中等强度有氧活动。
        where: Recommendations
      - text: 出现阴道出血、规律而疼痛的宫缩、阴道流液、头晕、胸痛、小腿疼痛或肿胀等情况，应立即停止运动并就医。
        where: Warning signs to discontinue exercise
    keywords: [怀孕, 孕期, 孕妇, 产后]
    review: claude_draft

  - id: K25
    domains: [exercise]
    title: 杠铃深蹲的动作要点
    source: Essentials of Strength Training and Conditioning（第 4 版）第 15 章 动作技术
    publisher: 美国国家体能协会（NSCA）
    year: 2016
    level: textbook
    population: 进行力量训练的人
    summary: 双脚约与肩同宽、脚尖略外展；下蹲时保持躯干稳定和脊柱中立，膝盖沿脚尖方向；在能保持姿势的前提下蹲到大腿约与地面平行。
    points:
      - text: 双脚与肩同宽或略宽，脚尖略向外。
        where: Back squat — starting position
      - text: 下蹲时背部保持平直（脊柱中立），膝盖与脚尖方向一致，脚跟不离地。
        where: Back squat — downward movement
      - text: 在能保持正确姿势的前提下，下蹲到大腿约与地面平行。
        where: Back squat — downward movement
    keywords: [深蹲, 蹲, 膝盖内扣, 动作]
    review: claude_draft

  - id: K26
    domains: [exercise]
    title: 硬拉的动作要点
    source: Essentials of Strength Training and Conditioning（第 4 版）第 15 章 动作技术
    publisher: 美国国家体能协会（NSCA）
    year: 2016
    level: textbook
    population: 进行力量训练的人
    summary: 杠铃贴近小腿，背部保持平直，用髋和腿发力把杠铃沿身体拉起；全程不弓背、不让杠铃离身体太远。
    points:
      - text: 起始时杠铃位于脚掌中部上方，贴近小腿，双手略宽于肩握杠。
        where: Deadlift — starting position
      - text: 拉起过程中背部保持平直，髋和膝一起伸展，杠铃贴着腿上升。
        where: Deadlift — upward movement
    keywords: [硬拉, 拉, 腰疼, 弓背, 动作]
    review: claude_draft

  - id: K27
    domains: [exercise]
    title: 卧推的动作要点
    source: Essentials of Strength Training and Conditioning（第 4 版）第 15 章 动作技术
    publisher: 美国国家体能协会（NSCA）
    year: 2016
    level: textbook
    population: 进行力量训练的人
    summary: 头、上背、臀部贴住凳面，双脚踩稳地面；杠铃下放到胸部下缘附近再推起；大重量时要有保护者。
    points:
      - text: 保持头、肩背、臀部与凳面接触，双脚平放地面。
        where: Bench press — starting position
      - text: 杠铃下放触及胸部（约乳头水平）后推起，手腕保持中立。
        where: Bench press — movement
      - text: 做卧推等杠铃过头或过脸的动作时，应有保护者。
        where: Spotting
    keywords: [卧推, 推胸, 肩膀疼, 动作]
    review: claude_draft

  # ---- 2026-10-23 扩充（spec [2026-10-23] §8）：补齐规程用到的资料 ----
  - id: K28
    domains: [training, exercise]
    title: 用"还剩几次"来自我调节强度（RIR 与 RPE）
    source: Application of the Repetitions in Reserve-Based Rating of Perceived Exertion Scale for Resistance Training（Strength Cond J 38(4):42–49）
    publisher: Helms、Cronin、Storey、Zourdos
    year: 2016
    level: review
    population: 做力量训练的成年人
    summary: 每组做完后估计"还能再做几次"（RIR），对应 1–10 的用力程度（RPE），用来在状态好坏不同的日子里调整重量，而不是死守固定重量。
    points:
      - text: RPE 10 表示一次都做不了了（力竭），RPE 9 表示还能再做 1 次，RPE 8 表示还能再做 2 次。
        where: The RIR-based RPE scale（Table）
      - text: 按 RIR 调整负荷，可以照顾到每天恢复状态的差异。
        where: Practical applications
    keywords: [还剩几次, 余力, rir, rpe, 力竭, 用力程度, 自我调节, 状态不好]
    review: claude_draft

  - id: K29
    domains: [training]
    title: 每组要不要练到力竭
    source: Influence of Resistance Training Proximity-to-Failure on Skeletal Muscle Hypertrophy — A Systematic Review with Meta-analysis（Sports Med 53(3):649–665）
    publisher: Refalo、Helms、Trexler、Hamilton、Fyfe
    year: 2023
    level: systematic_review
    population: 做力量训练的成年人
    summary: 练到力竭和停在接近力竭（留一两次余力），增肌效果相近；不必每组都练到力竭。
    points:
      - text: 练到力竭与不练到力竭相比，增肌效果没有明显差别。
        where: Results / Conclusions
      - text: 训练离力竭越远（剩的次数越多），增肌效果可能越差，所以也不要留太多余力。
        where: Discussion
    keywords: [力竭, 练到力竭, 余力, 留几次]
    review: claude_draft

  - id: K30
    domains: [training]
    title: 增肌与力量各用什么次数范围
    source: Loading Recommendations for Muscle Strength, Hypertrophy, and Local Endurance — A Re-Examination of the Repetition Continuum（Sports 9(2):32）
    publisher: Schoenfeld、Grgic、Van Every、Plotkin
    year: 2021
    level: review
    population: 做力量训练的成年人
    summary: 只要接近力竭，从较重到较轻的很宽的负荷范围都能增肌；想把力量练到最大，需要多用大重量、低次数。
    points:
      - text: 增肌可以在很宽的负荷范围内实现，较轻负荷（每组二三十次）做到接近力竭也有效。
        where: Hypertrophy
      - text: 最大力量的提高需要以较大负荷（较少次数）为主。
        where: Strength
    keywords: [几次, 次数, 增肌, 力量, 大重量, 小重量, 每组]
    review: claude_draft

  - id: K31
    domains: [training, recovery]
    title: 减量周怎么安排
    source: Integrating Deloading into Strength and Physique Sports Training Programmes — An International Delphi Consensus Approach（Sports Med Open 9:87）
    publisher: Bell、Strafford、Coleman 等
    year: 2023
    level: consensus
    population: 做力量与健美训练的人
    summary: 减量是一段明显降低训练压力的时间，用来恢复、为下一阶段做准备；常用做法是减少组数或降低用力程度。
    points:
      - text: 减量一般每 4–8 周安排一次，每次大约 1 周。
        where: Results — consensus statements
      - text: 减量主要通过减少训练量（组数）或降低用力程度来实现。
        where: Results — consensus statements
    keywords: [减量, 减量周, 降量, 恢复周, 平台期, 累积疲劳]
    review: claude_draft

  - id: K32
    domains: [training, exercise]
    title: 热身对运动表现的作用
    source: Effects of Warming-up on Physical Performance — A Systematic Review With Meta-analysis（J Strength Cond Res 24(1):140–148）
    publisher: Fradkin、Zazryn、Smoliga
    year: 2010
    level: systematic_review
    population: 运动人群
    summary: 大多数研究里，热身之后的运动表现更好，很少有变差的。
    points:
      - text: 纳入的研究中，大多数结果显示热身改善了随后的运动表现。
        where: Results
    keywords: [热身, 要不要热身, 怎么热身, 激活]
    review: claude_draft

  - id: K33
    domains: [recovery, exercise, safety]
    title: 带着疼练的界限（疼痛监测法）
    source: Continued Sports Activity, Using a Pain-Monitoring Model, During Rehabilitation in Patients With Achilles Tendinopathy（Am J Sports Med 35(6):897–906）
    publisher: Silbernagel、Thomeé、Eriksson、Karlsson
    year: 2007
    level: rct
    population: 跟腱病患者（康复训练常借用这个方法判断能不能带着轻微疼痛继续练）
    summary: 用 0–10 分记录疼痛：运动中疼痛不超过 5 分、第二天早上恢复到平时、一周比一周不加重，就可以继续活动。
    points:
      - text: 运动中和运动后疼痛允许到 0–10 分里的 5 分。
        where: Methods — pain-monitoring model
      - text: 疼痛应在第二天早上前消退，晨起疼痛和僵硬不能一周比一周加重。
        where: Methods — pain-monitoring model
      - text: 按这个方法继续跑跳活动的一组，恢复结果不比停止活动的一组差。
        where: Results
    keywords: [疼, 痛, 带着疼, 能不能练, 疼几分, 旧伤, 肌腱]
    review: claude_draft

  - id: K34
    domains: [recovery]
    title: 怎样睡得更好（睡眠习惯）
    source: Tips for Better Sleep
    publisher: 美国疾病控制与预防中心（CDC）
    year: 2022
    level: health_info
    population: 成年人
    summary: 固定作息、改善卧室环境、睡前少用电子设备、避免睡前大餐和咖啡因酒精、白天多活动，都有助于睡眠。
    points:
      - text: 每天同一时间上床和起床，周末也一样。
        where: Tips for Better Sleep
      - text: 卧室保持安静、黑暗、温度舒适；睡前把电子设备拿出卧室。
        where: Tips for Better Sleep
      - text: 睡前避免大餐、咖啡因和酒精；白天保持身体活动。
        where: Tips for Better Sleep
    keywords: [睡眠, 睡不好, 失眠, 睡不着, 熬夜, 作息, 早睡]
    url: https://www.cdc.gov/sleep/about/index.html
    review: claude_draft

  - id: K35
    domains: [recovery, training]
    title: 一夜没睡对肌肉合成的影响
    source: The effect of acute sleep deprivation on skeletal muscle protein synthesis and the hormonal environment（Physiol Rep 9(1):e14660）
    publisher: Lamon 等
    year: 2021
    level: rct
    population: 健康青年
    summary: 一整夜不睡后，第二天肌肉蛋白质合成下降，皮质醇升高、睾酮下降，不利于增肌和恢复。
    points:
      - text: 一夜完全不睡后，肌肉蛋白质合成下降约 18%。
        where: Results
      - text: 同时皮质醇升高约 21%，睾酮下降约 24%。
        where: Results
    keywords: [睡不好, 没睡, 熬夜, 睡眠, 增肌, 缺觉]
    review: claude_draft

  - id: K36
    domains: [nutrition]
    title: 什么时候吃（营养时机）
    source: International Society of Sports Nutrition Position Stand — Nutrient Timing（J Int Soc Sports Nutr 14:33）
    publisher: 国际运动营养学会（ISSN），Kerksick 等
    year: 2017
    level: position_stand
    population: 运动人群
    summary: 全天的总摄入最重要；在此基础上，把蛋白质分到每 3–4 小时一次，训练后两小时内吃一份优质蛋白，有助于肌肉合成。
    points:
      - text: 每 3–4 小时摄入一次蛋白质，每次 20–40 克（约 0.25–0.40 克/公斤体重）。
        where: Position statement — protein
      - text: 训练后两小时内摄入优质蛋白质，能明显刺激肌肉蛋白质合成。
        where: Position statement — protein
      - text: 睡前 30–40 分钟摄入 30–40 克酪蛋白，可以增加夜间的肌肉蛋白质合成。
        where: Position statement — protein
    keywords: [练前, 练后, 训练后, 什么时候吃, 吃饭时间, 睡前, 蛋白质分配, 多久吃]
    review: claude_draft

  - id: K37
    domains: [nutrition, training]
    title: 减脂期怎么吃才少掉肌肉
    source: Evidence-based recommendations for natural bodybuilding contest preparation — nutrition and supplementation（J Int Soc Sports Nutr 11:20）
    publisher: Helms、Aragon、Fitschen
    year: 2014
    level: review
    population: 做力量训练、正在减脂的人
    summary: 减得慢一点、蛋白质吃得高一点、坚持力量训练，有利于减脂时保住肌肉。
    points:
      - text: 每周减重约为体重的 0.5–1%，有利于保住肌肉。
        where: Caloric intake
      - text: 减脂期蛋白质每天 2.3–3.1 克/公斤去脂体重。
        where: Protein
    keywords: [减脂, 掉肌肉, 保肌, 减肥, 热量缺口, 一周瘦多少]
    review: claude_draft

  - id: K38
    domains: [nutrition, training]
    title: 运动人群每天吃多少碳水
    source: Nutrition and Athletic Performance（Med Sci Sports Exerc 48(3):543–568）
    publisher: 美国运动医学会、美国营养与饮食学会、加拿大营养师协会联合立场声明（Thomas、Erdman、Burke）
    year: 2016
    level: position_stand
    population: 运动人群
    summary: 碳水按训练量来定：练得越多越久，需要越多；长时间运动中要补充碳水。
    points:
      - text: 中等量训练（每天约 1 小时）每天碳水 5–7 克/公斤体重。
        where: Table — carbohydrate
      - text: 耐力训练（每天 1–3 小时中高强度）每天碳水 6–10 克/公斤体重。
        where: Table — carbohydrate
      - text: 持续 1–2.5 小时的运动中，每小时补充 30–60 克碳水。
        where: During exercise
    keywords: [碳水, 主食, 跑步吃什么, 马拉松, 半马, 耐力, 补给]
    review: claude_draft

  - id: K39
    domains: [nutrition, safety]
    title: 补剂：哪些有证据，有什么风险
    source: IOC consensus statement — dietary supplements and the high-performance athlete（Br J Sports Med 52(7):439–455）
    publisher: 国际奥委会（IOC），Maughan 等
    year: 2018
    level: consensus
    population: 运动员与运动人群
    summary: 只有少数补剂有较好的证据能提高运动表现；补剂可能被违禁或有害物质污染，要选第三方检测过的产品。
    points:
      - text: 有较好证据提高运动表现的补剂只有少数：咖啡因、肌酸、硝酸盐、β-丙氨酸、碳酸氢钠。
        where: Performance supplements
      - text: 补剂存在被污染的风险，选择经过第三方检测认证的产品。
        where: Risks of supplement use
    keywords: [补剂, 营养品, 增肌粉, 氮泵, 能不能吃, 有用吗, 违禁]
    review: claude_draft

  - id: K40
    domains: [training]
    title: 有氧和力量一起练（并发训练）
    source: Concurrent Training — A Meta-Analysis Examining Interference of Aerobic and Resistance Exercises（J Strength Cond Res 26(8):2293–2307）
    publisher: Wilson 等
    year: 2012
    level: systematic_review
    population: 成年人
    summary: 有氧和力量一起练，会削弱一部分增肌和力量效果；跑步的影响比骑车大，有氧越频繁、越长，影响越大。
    points:
      - text: 与只练力量相比，同时练有氧会减少增肌、力量和爆发力的提高。
        where: Results
      - text: 干扰的大小与有氧方式（跑步比骑车明显）、频率和时长有关。
        where: Results / Conclusions
    keywords: [有氧, 跑步, 力量, 一起练, 掉肌肉, 先有氧, 搭配, 半马]
    review: claude_draft

  - id: K41
    domains: [safety, training]
    title: 高血压的人怎么运动
    source: 中国高血压防治指南（2018 年修订版）
    publisher: 中国高血压防治指南修订委员会
    year: 2018
    level: guideline
    population: 高血压患者
    summary: 高血压的人适合规律的中等强度运动；安静时血压控制不好或超过 180/110 mmHg 时，暂时不做中等及以上强度的运动。
    points:
      - text: 除日常活动外，每周 4–7 天、每天累计 30–60 分钟中等强度运动。
        where: 生活方式干预 — 增加运动
      - text: 安静时血压未能很好控制或超过 180/110 mmHg 的患者，暂时禁忌中度及以上的运动。
        where: 生活方式干预 — 增加运动
    keywords: [高血压, 血压高, 血压, 降压]
    review: claude_draft

  - id: K42
    domains: [safety, training, nutrition]
    title: 糖尿病的人怎么运动
    source: Physical Activity/Exercise and Diabetes — A Position Statement of the American Diabetes Association（Diabetes Care 39(11):2065–2079）
    publisher: 美国糖尿病协会（ADA），Colberg 等
    year: 2016
    level: position_stand
    population: 糖尿病患者
    summary: 糖尿病的人每周要有足够的有氧和力量训练，不要连续多天不动；用胰岛素或促泌剂的人运动时要防低血糖。
    points:
      - text: 成年人每周 150 分钟以上中等到高强度有氧，分布在至少 3 天，不连续 2 天以上不运动。
        where: Recommendations
      - text: 每周 2–3 次（不在连续的两天）抗阻训练。
        where: Recommendations
      - text: 用胰岛素或胰岛素促泌剂的人，运动时和运动后要注意低血糖。
        where: Recommendations
    keywords: [糖尿病, 血糖, 低血糖, 胰岛素]
    review: claude_draft

  - id: K43
    domains: [nutrition]
    title: β-丙氨酸怎么吃
    source: International society of sports nutrition position stand — Beta-Alanine（J Int Soc Sports Nutr 12:30）
    publisher: 国际运动营养学会（ISSN），Trexler 等
    year: 2015
    level: position_stand
    population: 运动人群
    summary: β-丙氨酸需要连续吃几周才起作用，主要帮助 1–4 分钟的高强度运动；常见的副作用是皮肤刺痛感。
    points:
      - text: 每天 4–6 克，分次服用，至少连续 2–4 周。
        where: Position statement
      - text: 主要提高持续 1–4 分钟的高强度运动表现。
        where: Position statement
      - text: 常见副作用是皮肤刺痛感，分小剂量服用可以减轻。
        where: Position statement
    keywords: [β-丙氨酸, 丙氨酸, 刺痛, 氮泵, 补剂]
    review: claude_draft

  - id: K44
    domains: [recovery, safety, exercise]
    title: 腰痛：运动是主要的处理办法
    source: Low back pain and sciatica in over 16s — assessment and management（NICE guideline NG59）
    publisher: 英国国家卫生与临床优化研究所（NICE）
    year: 2020
    level: guideline
    population: 16 岁以上的腰痛与坐骨神经痛患者
    summary: 腰痛时建议做运动计划、尽量保持正常活动；在非专科的情况下不常规拍片。
    points:
      - text: 可以考虑参加运动计划（力量、有氧、身心类训练或它们的组合）来管理腰痛。
        where: Non-invasive treatments — exercise
      - text: 鼓励继续正常的活动。
        where: Information and self-management
      - text: 非专科的场合不常规做影像检查。
        where: Assessment — imaging
    keywords: [腰痛, 腰疼, 椎间盘, 坐骨神经, 下背痛, 腰酸]
    url: https://www.nice.org.uk/guidance/ng59
    review: claude_draft

  - id: K45
    domains: [recovery, exercise, training]
    title: 膝前痛（髌股疼痛）：练髋也练膝
    source: 2018 Consensus statement on exercise therapy and physical interventions to treat patellofemoral pain（Br J Sports Med 52(18):1170–1178）
    publisher: Collins 等（国际髌股疼痛研究会议）
    year: 2018
    level: consensus
    population: 髌股疼痛（膝盖前面疼）的人
    summary: 运动训练是膝前痛的首选；髋部和膝部的训练结合起来，比只练膝更好。
    points:
      - text: 推荐用运动训练减轻膝前痛，短期、中期和长期都有效。
        where: Recommendations — exercise therapy
      - text: 髋部和膝部训练结合，优于只做膝部训练。
        where: Recommendations — exercise therapy
    keywords: [膝盖疼, 膝前痛, 髌骨, 膝盖, 蹲起来疼, 上下楼疼]
    review: claude_draft

  - id: K46
    domains: [recovery, training, safety]
    title: 伤后回到训练是一步一步来的
    source: 2016 Consensus statement on return to sport from the First World Congress in Sports Physical Therapy, Bern（Br J Sports Med 50(14):853–864）
    publisher: Ardern 等
    year: 2016
    level: consensus
    population: 运动受伤后恢复训练的人
    summary: 伤后回到运动是一个连续的过程：先恢复参与、再回到运动、最后回到原来的水平；什么时候回去要和医疗人员一起决定。
    points:
      - text: 重返运动分三步：重返参与、重返运动、重返原有表现。
        where: Return to sport as a continuum
      - text: 能否重返运动由运动者与医疗团队共同决定。
        where: Shared decision-making
    keywords: [伤后, 受伤后, 恢复训练, 重新开始练, 回到训练, 康复后]
    review: claude_draft

  - id: K47
    domains: [recovery, exercise]
    title: 拉伸能不能减轻练后酸痛
    source: Stretching to prevent or reduce muscle soreness after exercise（Cochrane Database Syst Rev 2011(7):CD004577）
    publisher: Herbert、de Noronha、Kamper（Cochrane 综述）
    year: 2011
    level: systematic_review
    population: 健康成年人
    summary: 运动前后拉伸，对第二天的肌肉酸痛几乎没有减轻作用，不值得为了防酸痛专门拉伸。
    points:
      - text: 运动前后拉伸，在 100 分的酸痛评分上平均只减轻不到 2 分。
        where: Main results
    keywords: [拉伸, 酸痛, 练后酸, 放松, 静态拉伸]
    review: claude_draft

  - id: K48
    domains: [training, recovery]
    title: 同一肌群两次训练之间隔多久（ACSM）
    source: Quantity and Quality of Exercise for Developing and Maintaining Cardiorespiratory, Musculoskeletal, and Neuromotor Fitness in Apparently Healthy Adults（Med Sci Sports Exerc 43(7):1334–1359）
    publisher: 美国运动医学会（ACSM），Garber 等
    year: 2011
    level: position_stand
    population: 健康成年人
    summary: 每个主要肌群每周练 2–3 天；同一肌群两次抗阻训练之间至少隔 48 小时。
    points:
      - text: 每个主要肌群每周训练 2–3 天。
        where: Recommendations — resistance exercise
      - text: 同一肌群的两次抗阻训练之间至少间隔 48 小时。
        where: Recommendations — resistance exercise
    keywords: [恢复, 间隔, 48 小时, 隔天练, 同一肌群, 肌肉恢复]
    url: https://pubmed.ncbi.nlm.nih.gov/21694556/
    review: claude_draft

  - id: K49
    domains: [training, recovery]
    title: 不同动作、不同部位恢复时间不一样
    source: The Importance of Recovery in Resistance Training Microcycle Construction（J Hum Kinet 91:205–223）
    publisher: Sousa、Zourdos、Storey、Helms
    year: 2024
    level: systematic_review
    population: 进行抗阻训练的成年人（纳入 24 项研究，多为有训练基础的男性）
    summary: 下肢动作练后要 48–72 小时恢复，上肢一般 24 小时以内；多关节、动用肌肉多、以离心为主或在肌肉拉长位置发力的动作恢复更慢；练到力竭、组数多也会拉长恢复；个体差异大，要边练边看恢复情况。
    points:
      - text: 下肢动作需要 48–72 小时恢复，上肢动作一般 24 小时以内。
        where: Exercise selection
      - text: 多关节、动用肌肉多、强调离心或拉长位置的动作需要更长恢复时间。
        where: Exercise selection; Conclusions
      - text: 练到力竭和单次训练组数多都会延长恢复时间，两者叠加影响更大。
        where: Proximity to failure; Volume; Conclusions
      - text: 个体差异大，建议从较低训练量开始，观察恢复后再逐步加量。
        where: Abstract
    keywords: [恢复, 恢复时间, 肌肉恢复, 上肢, 下肢, 多关节, 力竭, 练后多久]
    url: https://doi.org/10.5114/jhk/186659
    review: claude_draft

  - id: K50
    domains: [training, recovery]
    title: 深蹲、卧推、硬拉练后的恢复过程
    source: Time course of recovery is similar for the back squat, bench press, and deadlift in well-trained males（Appl Physiol Nutr Metab 44(10):1033–1042）
    publisher: Belcher、Sousa、Carzoli 等
    year: 2019
    level: rct
    population: 训练多年的男性（12 人）
    summary: 4 组做到力竭后，深蹲的发力速度到 72 小时仍低于练前；卧推只在练完当时下降；硬拉没有比深蹲造成更多损伤或更久恢复。
    points:
      - text: 深蹲后平均发力速度下降，持续到 72 小时。
        where: Results
      - text: 卧推只在练完即刻下降，硬拉没有明显下降。
        where: Results
    keywords: [深蹲, 卧推, 硬拉, 恢复, 72 小时]
    url: https://doi.org/10.1139/apnm-2019-0004
    review: claude_draft

  - id: K51
    domains: [training, recovery]
    title: 练到力竭会拉长恢复时间
    source: Time course of recovery following resistance training leading or not to failure（Eur J Appl Physiol 117(12):2387–2399）
    publisher: Morán-Navarro、Pérez、Mora-Rodríguez 等
    year: 2017
    level: rct
    population: 有抗阻训练基础的男性（10 人）
    summary: 训练量相同时，每组都练到力竭比不练到力竭，神经肌肉表现和代谢指标的恢复要多花 24–48 小时。
    points:
      - text: 练到力竭的方案在练后 24–48 小时的恢复明显慢于不到力竭的方案，即使总训练量相同。
        where: Results; Conclusions
    keywords: [力竭, 练到力竭, 恢复, 疲劳]
    url: https://doi.org/10.1007/s00421-017-3725-7
    review: claude_draft

  - id: K52
    domains: [training, recovery]
    title: 不同肌肉做离心训练后的损伤程度不一样
    source: Comparison in eccentric exercise-induced muscle damage among four limb muscles（Eur J Appl Physiol 111(2):211–223）
    publisher: Chen、Lin、Chen、Lin、Nosaka
    year: 2011
    level: rct
    population: 没有训练基础的年轻男性
    summary: 做不习惯的最大离心训练后，屈肘和伸肘肌（肱二头、肱三头）损伤最重，屈膝肌（大腿后侧）次之，伸膝肌（大腿前侧）最轻；作者认为和这块肌肉日常用得多不多有关。
    points:
      - text: 屈肘、伸肘肌各项损伤指标的变化都大于屈膝、伸膝肌。
        where: Results
      - text: 屈膝肌的变化大于伸膝肌。
        where: Results
      - text: 差别可能与肌肉在日常活动中的使用程度有关。
        where: Discussion
    keywords: [离心, 肌肉损伤, 酸痛, 手臂, 大腿后侧, 不习惯]
    url: https://doi.org/10.1007/s00421-010-1648-7
    review: claude_draft

  - id: K53
    domains: [training, recovery]
    title: 同样的训练第二次做，损伤明显变小
    source: Damage and the repeated bout effect of arm, leg, and trunk muscles induced by eccentric resistance exercises（Scand J Med Sci Sports 29(5):725–735）
    publisher: Chen、Yang、Huang 等
    year: 2019
    level: rct
    population: 平时不运动的年轻男性（15 人）
    summary: 9 个手臂、腿、躯干的离心训练做完两周后再做一次，第二次的力量下降、酸痛和血液损伤指标都明显更小（重复训练效应）。
    points:
      - text: 第二次训练后各项指标的变化都小于第一次。
        where: Results
    keywords: [重复训练效应, 不习惯, 第一次练, 酸痛, 恢复]
    url: https://doi.org/10.1111/sms.13388
    review: claude_draft

  - id: K54
    domains: [training, recovery]
    title: 多关节动作比单关节动作恢复慢
    source: Different time course recovery of muscle oedema within the quadriceps femoris and functional performance after single- vs multi-joint exercises（Biol Sport 40(3):767–774）
    publisher: Dourado、Vieira、Boullosa、Bottaro
    year: 2023
    level: rct
    population: 没有训练基础的年轻男性（14 人）
    summary: 腿举后力量 48 小时恢复，腿屈伸后 24 小时恢复；差别不大，但多关节动作的功能恢复更慢。
    points:
      - text: 腿屈伸后峰值力矩 24 小时恢复，腿举后 48 小时恢复。
        where: Results
    keywords: [多关节, 单关节, 腿举, 腿屈伸, 恢复]
    url: https://doi.org/10.5114/biolsport.2023.119984
    review: claude_draft

  - id: K55
    domains: [training, recovery]
    title: 大训练量比大重量恢复更久
    source: Comparison of the recovery response from high-intensity and high-volume resistance exercise in trained men（Eur J Appl Physiol 117(7):1287–1298）
    publisher: Bartolomei、Sadres、Church 等
    year: 2017
    level: rct
    population: 有抗阻训练基础的男性（12 人）
    summary: 深蹲 8 组 × 10 次（70%）比 8 组 × 3 次（90%）造成更大的力量和爆发力下降、更多肌肉损伤，恢复更久。
    points:
      - text: 大训练量方案的表现下降和肌肉损伤都大于大重量方案。
        where: Results; Conclusions
    keywords: [训练量, 组数, 恢复, 深蹲]
    url: https://doi.org/10.1007/s00421-017-3598-9
    review: claude_draft
