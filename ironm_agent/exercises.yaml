# 动作库：做法、要点、常见错误、替代动作、什么情况先别做。
# 内容由 Claude 按常见训练指南整理（claude_draft），待审定；页面上统一提示"出现疼痛就停，有伤病先问医生或康复师"。
# part：腿臀、胸、背、肩、手臂、核心、全身、有氧；equipment：自重、哑铃、壶铃、弹力带、杠铃、单杠、器械
version: "0.1"
review: claude_draft

exercises:
  - id: bodyweight-squat
    name: 自重深蹲
    part: 腿臀
    muscles: 股四头肌、臀大肌
    equipment: [自重]
    level: 入门
    steps:
      - 双脚略比肩宽，脚尖稍向外
      - 吸气，屈髋屈膝向下坐，双臂向前伸保持平衡
      - 蹲到大腿接近与地面平行，或不疼的深度
      - 脚掌发力站起，同时呼气
    cues: [膝盖顺着脚尖方向, 全脚掌着地，重心在脚掌中部, 背部挺直，胸口朝前]
    mistakes: [膝盖向内扣, 脚跟抬起]
    easier: 箱式深蹲（坐到箱子或椅子上再站起）
    harder: 高脚杯深蹲、保加利亚分腿蹲
    avoid: 蹲深时膝盖疼，先用箱子把深度限制在不疼的范围；疼痛越来越重就停

  - id: goblet-squat
    name: 高脚杯深蹲
    part: 腿臀
    muscles: 股四头肌、臀大肌、核心
    equipment: [哑铃, 壶铃]
    level: 入门
    steps:
      - 双手捧住一只哑铃或壶铃，贴在胸前
      - 双脚略比肩宽，脚尖稍向外
      - 屈髋屈膝下蹲，手肘落在两膝之间
      - 脚掌发力站起
    cues: [重物始终贴着胸口, 上身尽量直立, 膝盖顺着脚尖方向]
    mistakes: [重物离开身体，身体前倾, 蹲到底时腰背变圆]
    easier: 自重深蹲、箱式深蹲
    harder: 杠铃深蹲
    avoid: 膝盖蹲深会疼时先限制深度；腰背不适时先减轻重量、减小幅度

  - id: box-squat
    name: 箱式深蹲
    part: 腿臀
    muscles: 股四头肌、臀大肌
    equipment: [自重, 哑铃, 壶铃, 杠铃]
    level: 入门
    steps:
      - 身后放一个稳固的箱子或椅子，高度定在下蹲不疼的位置
      - 向后坐，臀部轻轻碰到箱子，不完全坐实放松
      - 碰到后马上用脚掌发力站起
    cues: [向后坐，小腿尽量保持竖直, 轻碰即起，不要砸在箱子上, 不疼的话可以每周把箱子降低一点]
    mistakes: [坐实放松后再起，腰部受力, 起身时膝盖向内扣]
    easier: 从椅子上坐下、站起
    harder: 去掉箱子做全幅度深蹲
    avoid: 适合膝盖蹲深会疼时控制深度；如果碰到箱子的高度也疼，先别做，找医生或康复师看看

  - id: back-squat
    name: 杠铃深蹲
    part: 腿臀
    muscles: 股四头肌、臀大肌、竖脊肌
    equipment: [杠铃]
    level: 进阶
    steps:
      - 杠铃放在上背部（斜方肌上沿），双手握杠，收紧上背
      - 出架后双脚略比肩宽站稳
      - 深吸一口气撑住腹部，屈髋屈膝下蹲
      - 蹲到目标深度后发力站起，站直后再换气
    cues: [下蹲前先吸气撑住腹压, 膝盖顺着脚尖方向, 杠铃在脚掌中部正上方上下移动]
    mistakes: [起身时臀部先抬起，变成弯腰, 下蹲时腰背变圆]
    easier: 高脚杯深蹲
    harder: 每次小幅加重
    avoid: 新手先用高脚杯深蹲学会动作；在深蹲架里做并设好保护杆；腰痛发作期先别做

  - id: romanian-deadlift
    name: 罗马尼亚硬拉
    part: 腿臀
    muscles: 大腿后侧（腘绳肌）、臀大肌、竖脊肌
    equipment: [哑铃, 壶铃, 杠铃]
    level: 入门
    steps:
      - 站直，双手握哑铃或杠铃放在大腿前
      - 膝盖微屈并保持这个角度，臀部向后推，上身前倾，重物贴着大腿往下滑
      - 大腿后侧明显拉紧时停住（大约到膝盖下方）
      - 臀部向前推，回到站直
    cues: [动作来自髋部向后折，不是弯腰, 背部始终平直, 重物贴着腿走]
    mistakes: [弯腰去够地面, 膝盖弯得太多，变成了深蹲]
    easier: 徒手练习：双手叉腰，只练臀部向后推
    harder: 单腿罗马尼亚硬拉
    avoid: 腰痛发作期先别做；背部保持不了平直时减小幅度或减轻重量

  - id: deadlift
    name: 杠铃硬拉
    part: 腿臀
    muscles: 臀大肌、大腿后侧、竖脊肌、背阔肌
    equipment: [杠铃]
    level: 进阶
    steps:
      - 双脚与髋同宽，杠铃在脚掌中部正上方
      - 屈髋屈膝握杠，小腿贴近杠铃
      - 挺胸、收紧背部，吸气撑住腹部
      - 双腿推地把杠铃拉起，杠铃贴着腿上升，站直后按原路放下
    cues: [杠铃始终贴着腿, 先把背和腹部收紧再发力, 起身时髋和肩一起上升]
    mistakes: [圆背拉起, 杠铃离身体太远]
    easier: 罗马尼亚硬拉、壶铃硬拉
    harder: 每次小幅加重
    avoid: 腰痛发作期、背部保持不了平直时先别做；新手最好先跟教练学

  - id: bulgarian-split-squat
    name: 保加利亚分腿蹲
    part: 腿臀
    muscles: 股四头肌、臀大肌
    equipment: [自重, 哑铃]
    level: 进阶
    steps:
      - 背对凳子站立，一只脚的脚背搭在凳子上
      - 前脚向前迈出一大步站稳
      - 身体垂直下降，前腿屈膝到大腿接近水平
      - 前脚发力站起；做完一侧再换另一侧
    cues: [重心放在前脚, 前膝顺着脚尖方向, 上身稍向前倾并保持稳定]
    mistakes: [前脚离凳子太近，膝盖过度前移, 身体左右晃]
    easier: 原地分腿蹲（后脚踩在地上）
    harder: 双手各拿一只哑铃
    avoid: 膝盖疼时先减小下蹲幅度；平衡不好时扶墙做

  - id: reverse-lunge
    name: 后撤弓步
    part: 腿臀
    muscles: 股四头肌、臀大肌
    equipment: [自重, 哑铃]
    level: 入门
    steps:
      - 双脚并拢站立
      - 一条腿向后退一大步，前脚掌着地
      - 双膝弯曲下蹲，后膝接近地面
      - 前脚发力回到起始位置，左右交替
    cues: [前膝顺着脚尖，不向内扣, 上身保持直立, 比向前迈步的弓步对膝盖更友好]
    mistakes: [步子太小，前膝压力大, 身体向前倒]
    easier: 原地分腿蹲
    harder: 双手拿哑铃、行走弓步
    avoid: 膝盖疼时减小幅度；平衡不好时扶墙做

  - id: glute-bridge
    name: 臀桥
    part: 腿臀
    muscles: 臀大肌、大腿后侧
    equipment: [自重, 哑铃, 弹力带]
    level: 入门
    steps:
      - 仰卧，屈膝，双脚踩地与髋同宽
      - 收紧腹部，臀部发力把髋部抬起，直到肩、髋、膝成一条直线
      - 最高处停 1 秒，再慢慢放下
    cues: [用臀部发力，不用腰去顶, 下巴微收, 可以在膝盖上套弹力带向外撑]
    mistakes: [腰部过度反弓, 脚离臀部太远，大腿后侧抽筋]
    easier: 减小抬起的幅度
    harder: 单腿臀桥、把哑铃放在髋部
    avoid: 一般都可以做；腰部不适时减小幅度

  - id: step-up
    name: 台阶上下
    part: 腿臀
    muscles: 股四头肌、臀大肌
    equipment: [自重, 哑铃]
    level: 入门
    steps:
      - 面对一个稳固的台阶或凳子
      - 一只脚整个踩上台阶
      - 前脚发力把身体带上去站直，后脚不蹬地借力
      - 慢慢下来；做完一侧再换另一侧
    cues: [整个脚掌踩稳, 膝盖顺着脚尖方向, 下来时控制速度]
    mistakes: [后脚蹬地借力, 台阶太高，膝盖弯得太深]
    easier: 用更矮的台阶
    harder: 双手拿哑铃、用更高的台阶
    avoid: 膝盖疼时换更矮的台阶

  - id: calf-raise
    name: 提踵
    part: 腿臀
    muscles: 小腿（腓肠肌、比目鱼肌）
    equipment: [自重, 哑铃]
    level: 入门
    steps:
      - 前脚掌站在台阶边缘，手扶墙保持平衡
      - 脚跟慢慢下沉，到小腿有拉伸感
      - 踮起脚尖到最高处，停 1 秒
      - 慢慢放下
    cues: [全程慢速, 最高处停一下, 膝盖伸直主要练腓肠肌，坐着做主要练比目鱼肌]
    mistakes: [上下弹动借力, 幅度太小]
    easier: 在平地上做
    harder: 单腿提踵、手拿哑铃
    avoid: 跟腱疼时先别做

  - id: band-lateral-walk
    name: 弹力带侧向走
    part: 腿臀
    muscles: 臀中肌
    equipment: [弹力带]
    level: 入门
    steps:
      - 弹力带套在膝盖上方或脚踝
      - 保持半蹲姿势
      - 一只脚向侧面迈一步，另一只脚跟上，弹力带始终绷着
      - 走 10–15 步后反方向走回来
    cues: [半蹲的高度保持不变, 膝盖向外撑, 上身不左右摇晃]
    mistakes: [身体忽高忽低, 双脚并拢让弹力带松掉]
    easier: 弹力带套在膝盖上方（阻力小一些）
    harder: 套在脚踝或换更紧的弹力带
    avoid: 一般都可以做，常用来热身、练臀部外侧

  - id: leg-press
    name: 腿举
    part: 腿臀
    muscles: 股四头肌、臀大肌
    equipment: [器械]
    level: 入门
    steps:
      - 坐进腿举机，背和臀部贴紧靠垫
      - 双脚与髋同宽踩在踏板中部
      - 松开保险，屈膝把踏板放下来，到不疼、腰不离开靠垫的深度
      - 脚掌发力推起，膝盖不锁死
    cues: [腰臀始终贴着靠垫, 脚放高一些更多练到臀部、膝盖压力更小, 推到顶时膝盖留一点弯曲]
    mistakes: [放得太深，臀部离开靠垫、腰部变圆, 推到顶把膝盖锁死]
    easier: 减轻重量、减小幅度
    harder: 单腿腿举
    avoid: 膝盖疼时把脚放高、减小幅度

  - id: push-up
    name: 俯卧撑
    part: 胸
    muscles: 胸大肌、肱三头肌、三角肌前束
    equipment: [自重]
    level: 入门
    steps:
      - 双手略比肩宽撑地，身体从头到脚成一条直线
      - 屈肘，让胸口下降到接近地面
      - 推起回到起始位置
    cues: [收紧腹部和臀部，不塌腰, 手肘和身体大约成 45 度, 下放时控制速度]
    mistakes: [塌腰或撅臀, 手肘向两侧张开成 90 度]
    easier: 跪姿俯卧撑、双手扶桌子或墙做
    harder: 双脚垫高、负重俯卧撑
    avoid: 肩膀前侧疼时减小幅度，或换成双手扶高的俯卧撑

  - id: dumbbell-bench-press
    name: 哑铃卧推
    part: 胸
    muscles: 胸大肌、肱三头肌、三角肌前束
    equipment: [哑铃]
    level: 入门
    steps:
      - 仰卧在平凳上，双脚踩稳地面
      - 双手拿哑铃放在胸部两侧上方
      - 推起到手臂接近伸直
      - 慢慢放下，到胸部两侧有拉伸感
    cues: [肩胛骨向后、向下收紧, 手肘和身体大约成 45–60 度, 两只哑铃同时动]
    mistakes: [下放太快、在底部反弹, 手肘完全张开成 90 度]
    easier: 地板卧推（躺在地上做，手肘碰地就停）
    harder: 上斜哑铃卧推、加重
    avoid: 肩膀前侧疼时用地板卧推限制幅度

  - id: bench-press
    name: 杠铃卧推
    part: 胸
    muscles: 胸大肌、肱三头肌、三角肌前束
    equipment: [杠铃]
    level: 进阶
    steps:
      - 仰卧在卧推凳上，眼睛在杠铃正下方
      - 握距略比肩宽，肩胛骨收紧下沉
      - 出杠后把杠铃放到胸骨下沿附近
      - 推起到手臂伸直
    cues: [双脚踩稳，臀部不离开凳子, 下放和推起的路线保持稳定, 大重量要有人保护或用安全杆]
    mistakes: [杠铃在胸口反弹, 臀部离开凳子]
    easier: 哑铃卧推、俯卧撑
    harder: 每次小幅加重
    avoid: 没有保护时不做大重量；肩痛时先换成哑铃卧推或地板卧推

  - id: one-arm-row
    name: 单臂哑铃划船
    part: 背
    muscles: 背阔肌、菱形肌、肱二头肌
    equipment: [哑铃]
    level: 入门
    steps:
      - 一只手和同侧膝盖撑在凳子上，背部平直
      - 另一只手拿哑铃，自然下垂
      - 屈肘把哑铃拉向髋部
      - 慢慢放下；做完一侧再换另一侧
    cues: [用背带动手肘向后上方拉, 背部平直，身体不扭转, 最高处稍停一下]
    mistakes: [扭身体借力, 耸肩去拉]
    easier: 减轻重量
    harder: 加重、最高处停 2 秒
    avoid: 腰部不适时一定要用手撑住

  - id: band-row
    name: 弹力带坐姿划船
    part: 背
    muscles: 背阔肌、菱形肌
    equipment: [弹力带]
    level: 入门
    steps:
      - 坐在地上双腿伸直，弹力带绕过脚掌，双手握住两端
      - 挺胸坐直
      - 屈肘把弹力带拉向腹部，肩胛骨向后夹
      - 慢慢放回
    cues: [先夹肩胛骨再屈肘, 不耸肩, 放回时控制速度]
    mistakes: [身体后仰借力, 耸肩]
    easier: 用更松的弹力带
    harder: 用更紧的弹力带、最高处停一下
    avoid: 一般都可以做

  - id: pull-up
    name: 引体向上
    part: 背
    muscles: 背阔肌、肱二头肌
    equipment: [单杠, 弹力带]
    level: 进阶
    steps:
      - 双手正握单杠，略比肩宽，身体悬垂
      - 肩膀下沉，屈肘把身体拉起，到下巴过杠
      - 慢慢下放到手臂伸直
    cues: [先沉肩再拉, 身体不大幅摆动, 下放时控制速度]
    mistakes: [摆动身体借力, 只做一半幅度]
    easier: 弹力带辅助引体向上、高位下拉
    harder: 负重引体向上
    avoid: 肩部疼痛时先别做

  - id: lat-pulldown
    name: 高位下拉
    part: 背
    muscles: 背阔肌、肱二头肌
    equipment: [器械, 弹力带]
    level: 入门
    steps:
      - 坐在下拉器上，大腿卡在靠垫下面
      - 双手略比肩宽握住横杆
      - 沉肩，把横杆拉到上胸前
      - 慢慢放回到手臂伸直
    cues: [挺胸，身体稍向后仰, 用手肘向下拉, 不要拉到脖子后面]
    mistakes: [身体大幅后仰借力, 拉到脖子后面]
    easier: 减轻重量
    harder: 加重、换窄握
    avoid: 肩部疼痛时减小幅度；在家可以把弹力带挂高处做

  - id: dumbbell-shoulder-press
    name: 哑铃推举
    part: 肩
    muscles: 三角肌、肱三头肌
    equipment: [哑铃]
    level: 入门
    steps:
      - 坐或站，双手拿哑铃放在肩膀两侧，掌心朝前
      - 向上推起到手臂接近伸直
      - 慢慢放回到肩膀旁边
    cues: [收紧腹部，腰不过度反弓, 推起时哑铃稍向中间靠拢, 下放时控制速度]
    mistakes: [腰部反弓借力, 放得太低、太快]
    easier: 坐在有靠背的凳子上做、减轻重量
    harder: 站着做、加重
    avoid: 举过头顶时肩痛就先别做，换成弹力带面拉或小重量侧平举

  - id: lateral-raise
    name: 侧平举
    part: 肩
    muscles: 三角肌中束
    equipment: [哑铃, 弹力带]
    level: 入门
    steps:
      - 站直，双手拿哑铃放在身体两侧
      - 手肘微屈，向两侧抬起到与肩同高
      - 慢慢放下
    cues: [用小重量, 手肘带动，略高于手腕, 不耸肩]
    mistakes: [甩动身体借力, 抬得太高、耸肩]
    easier: 单侧做、减轻重量
    harder: 最高处停一下、慢慢放下
    avoid: 抬起时肩痛就减小幅度

  - id: band-face-pull
    name: 弹力带面拉
    part: 肩
    muscles: 三角肌后束、菱形肌、肩袖肌群
    equipment: [弹力带]
    level: 入门
    steps:
      - 把弹力带固定在和脸差不多高的地方，双手握住两端后退拉紧
      - 屈肘把弹力带拉向脸部，双手向两侧分开
      - 手肘高于手腕，停 1 秒后慢慢放回
    cues: [肩胛骨向后夹, 手肘抬高, 动作放慢]
    mistakes: [身体后仰借力, 耸肩]
    easier: 用更松的弹力带
    harder: 用更紧的弹力带
    avoid: 一般都可以做，适合久坐、含胸圆肩的人

  - id: dumbbell-curl
    name: 哑铃弯举
    part: 手臂
    muscles: 肱二头肌
    equipment: [哑铃, 弹力带]
    level: 入门
    steps:
      - 站直，双手拿哑铃自然下垂，掌心朝前
      - 上臂贴住身体，屈肘把哑铃举到肩前
      - 慢慢放下
    cues: [上臂不前后移动, 不甩身体, 放下时控制速度]
    mistakes: [身体后仰借力, 手肘向前移]
    easier: 减轻重量、左右交替做
    harder: 锤式弯举、慢慢放下
    avoid: 一般都可以做

  - id: bench-dip
    name: 凳上臂屈伸
    part: 手臂
    muscles: 肱三头肌
    equipment: [自重]
    level: 入门
    steps:
      - 背对凳子，双手撑在凳子边缘，手指朝前
      - 双腿向前伸，臀部离开凳子
      - 屈肘让身体下降到上臂接近水平
      - 推起回到起始位置
    cues: [身体贴近凳子, 肩膀下沉，不耸肩, 不要下得太深]
    mistakes: [下得太深，肩膀前侧压力大, 手肘向外张开]
    easier: 屈膝做（脚离身体近一些）
    harder: 双脚垫高
    avoid: 肩膀前侧疼时换成弹力带下压或窄距俯卧撑

  - id: plank
    name: 平板支撑
    part: 核心
    muscles: 腹横肌、腹直肌
    equipment: [自重]
    level: 入门
    steps:
      - 前臂撑地，手肘在肩膀正下方
      - 双脚并拢，身体从头到脚成一条直线
      - 正常呼吸，坚持到目标时间
    cues: [收紧腹部和臀部, 不塌腰、不撅臀, 下巴微收]
    mistakes: [塌腰, 憋气]
    easier: 跪姿平板支撑
    harder: 抬起一只手或一条腿
    avoid: 腰痛、姿势保持不住时就停

  - id: dead-bug
    name: 死虫式
    part: 核心
    muscles: 腹横肌、腹直肌
    equipment: [自重]
    level: 入门
    steps:
      - 仰卧，双臂伸直朝上，屈髋屈膝把双腿抬起成 90 度
      - 腰背贴住地面
      - 同时伸出一侧手臂和对侧腿，到接近地面
      - 收回后换另一侧
    cues: [腰始终贴地, 动作要慢, 伸出去时呼气]
    mistakes: [腰离开地面拱起, 动作太快]
    easier: 只动腿或只动手
    harder: 手拿轻哑铃、腿伸得更远
    avoid: 适合腰部需要保护的人练核心

  - id: side-plank
    name: 侧平板支撑
    part: 核心
    muscles: 腹斜肌、臀中肌
    equipment: [自重]
    level: 入门
    steps:
      - 侧卧，前臂撑地，手肘在肩膀正下方
      - 双脚叠放，抬起髋部，身体成一条直线
      - 坚持到目标时间后换另一侧
    cues: [髋部不下沉, 身体不前后倒, 保持呼吸]
    mistakes: [髋部下垂, 耸肩]
    easier: 屈膝侧平板支撑
    harder: 抬起上面的那条腿
    avoid: 肩部疼痛时先别做

  - id: bird-dog
    name: 鸟狗式
    part: 核心
    muscles: 竖脊肌、臀大肌、腹横肌
    equipment: [自重]
    level: 入门
    steps:
      - 四点跪姿，手在肩膀下方，膝盖在髋部下方
      - 同时伸出一侧手臂和对侧腿，到和身体成一条直线
      - 停 2 秒，收回后换另一侧
    cues: [背部保持平直，不左右晃, 伸出去时像往远处够, 动作要慢]
    mistakes: [腰部反弓, 骨盆歪向一侧]
    easier: 只伸手或只伸腿
    harder: 收回时手肘碰膝盖，再伸展
    avoid: 一般都可以做，常用于腰背的热身和康复训练

  - id: kettlebell-swing
    name: 壶铃摇摆
    part: 全身
    muscles: 臀大肌、大腿后侧、核心
    equipment: [壶铃, 哑铃]
    level: 进阶
    steps:
      - 双脚略比肩宽，壶铃放在身前
      - 屈髋抓住壶铃，向后摆到两腿之间
      - 臀部用力向前推，把壶铃荡到胸口高度
      - 随着惯性下落，再次屈髋接住，连续做
    cues: [发力来自髋部前推，不是用手臂抬, 背部保持平直, 站直时收紧臀部和腹部]
    mistakes: [做成了深蹲, 用手臂往上抬, 圆背]
    easier: 先练罗马尼亚硬拉、壶铃硬拉
    harder: 加重、单手摇摆
    avoid: 腰痛时先别做；先学会臀部向后折的动作

  - id: burpee
    name: 波比跳
    part: 全身
    muscles: 全身、心肺
    equipment: [自重]
    level: 进阶
    steps:
      - 站立，下蹲双手撑地
      - 双脚向后跳成俯卧撑姿势
      - 双脚跳回手边
      - 向上跳起，双手举过头顶
    cues: [落地要轻，膝盖微屈, 撑地时身体成一条直线, 按自己的节奏做]
    mistakes: [塌腰, 落地太重]
    easier: 不跳：双脚一步步后撤、再走回来站起
    harder: 撑地时加一个俯卧撑
    avoid: 膝盖、脚踝有伤或半月板有问题时先别做跳跃动作

  - id: cycling
    name: 骑行（动感单车）
    part: 有氧
    muscles: 心肺、大腿
    equipment: [器械]
    level: 入门
    steps:
      - 调好座椅高度：脚踩到最低点时膝盖微屈
      - 先用低阻力热身 5 分钟
      - 中等强度骑 20–40 分钟（能说话、但不能唱歌）
      - 最后用低阻力放松 5 分钟
    cues: [膝盖对准脚尖方向, 上身放松, 阻力从低往高加]
    mistakes: [座椅太低，膝盖压力大, 阻力太大，蹬不圆]
    easier: 降低阻力、缩短时间
    harder: 快慢交替的间歇骑行
    avoid: 对膝盖冲击小，适合不能跑跳的人

  - id: brisk-walk
    name: 快走
    part: 有氧
    muscles: 心肺、腿部
    equipment: [自重]
    level: 入门
    steps:
      - 先慢走 5 分钟热身
      - 加快到微微喘、还能说完整句子的速度
      - 保持 20–40 分钟
      - 最后慢走 5 分钟放松
    cues: [步子自然，手臂前后摆动, 脚跟先着地再过渡到脚尖, 穿合脚、有缓冲的鞋]
    mistakes: [一开始就走太快, 低头含胸]
    easier: 放慢速度、缩短时间
    harder: 走上坡、加快速度
    avoid: 走路时胸闷、胸痛、头晕要马上停下并就医
