# 动作库的结构化标注（spec [2026-10-23] §12）：计划检查与替代动作用。
# pattern：动作模式（同一模式的动作可以互相替代）
#   squat 蹲、hinge 髋铰链、lunge 单腿、bridge 臀桥类、h_push 水平推、v_push 垂直推、h_pull 水平拉、
#   v_pull 垂直拉、shoulder 肩部小肌群、curl 弯举、extension 臂屈伸、calf 小腿、abduction 髋外展、
#   core 核心、plyo 跳跃全身、cardio 有氧
# groups：主要练到的肌群（算每周组数时每组记 1 组）
# muscles / assist：人体图用的细分肌肉，主要练到 / 辅助练到（辅助的每组按半组算）
# stress：会给哪些关节加负担（这些部位有伤时，计划检查会标出，替代动作会避开）
#   knee 膝、back 腰背、shoulder 肩、wrist 手腕、ankle 脚踝、neck 颈
# friendly：常用来照顾哪些部位（有伤时替代动作优先选）
# 编号与 exercises.yaml 对应；内容由 Claude 整理，待审定。
