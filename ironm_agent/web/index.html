<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7ec850">
  <title>IronM · AI 健身</title>
  <link rel="stylesheet" href="/iron/style.css">
  <script src="/iron/app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="bar" id="bar" hidden>
      <div class="bar-text">
        <div class="bar-kicker" id="kicker"></div>
        <h1 class="bar-title" id="title"></h1>
      </div>
    </header>
    <main id="view" class="view" aria-live="polite"></main>
  </div>
  <nav class="tabs" id="tabs" hidden aria-label="主导航">
    <div class="tabs-inner">
      <a href="#home" data-tab="home"><span class="ti" data-icon="hexhome"></span>首页</a>
      <a href="#atlas" data-tab="atlas"><span class="ti" data-icon="atlas"></span>图鉴</a>
      <a href="#record" data-tab="record"><span class="ti" data-icon="record"></span>战绩</a>
      <a href="#me" data-tab="me"><span class="ti" data-icon="pilot"></span>我</a>
    </div>
  </nav>
  <button class="fab" id="fab" type="button" hidden aria-label="快捷记录：补打卡、记一餐、记体重、记腰围体脂"><span class="ti" data-icon="plus"></span></button>
  <div id="sheet-root"></div>
</body>
</html>
