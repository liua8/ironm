<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f4">
  <title>IronM · AI 健身管家</title>
  <link rel="stylesheet" href="/iron/style.css">
  <script src="/iron/app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="bar" id="bar" hidden>
      <div class="bar-text">
        <div class="bar-kicker" id="kicker"></div>
        <h1 class="bar-title" id="title"></h1>
      </div>
      <a class="avatar" id="avatar" href="#me" aria-label="我的"></a>
    </header>
    <main id="view" class="view" aria-live="polite"></main>
  </div>
  <nav class="tabs" id="tabs" hidden aria-label="主导航">
    <div class="tabs-inner">
      <a href="#home" data-tab="home"><span class="ti" data-icon="home"></span>首页</a>
      <a href="#moves" data-tab="moves"><span class="ti" data-icon="dumbbell"></span>动作</a>
      <a href="#chat" data-tab="chat" class="coach-tab"><span class="ti" data-icon="coach"></span>教练</a>
      <a href="#food" data-tab="food"><span class="ti" data-icon="food"></span>饮食</a>
      <a href="#data" data-tab="data"><span class="ti" data-icon="chart"></span>数据</a>
    </div>
  </nav>
  <div id="sheet-root"></div>
</body>
</html>
