<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c0b">
  <title>IronM · AI 健身管家</title>
  <link rel="stylesheet" href="/iron/style.css">
  <script src="/iron/app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="bar" id="bar" hidden>
      <div class="bar-text">
        <div class="bar-kicker" id="kicker"></div>
        <h1 class="bar-title" id="title"></h1>
      </div>
      <a class="bar-icon" id="tierlink" href="#tier" aria-label="夯榜"><span class="ti" data-icon="trophy"></span></a>
      <a class="avatar" id="avatar" href="#me" aria-label="我的"></a>
    </header>
    <main id="view" class="view" aria-live="polite"></main>
  </div>
  <nav class="tabs" id="tabs" hidden aria-label="主导航">
    <div class="tabs-inner">
      <a href="#home" data-tab="home"><span class="ti" data-icon="coach"></span>管家</a>
      <a href="#train" data-tab="train"><span class="ti" data-icon="dumbbell"></span>训练</a>
      <a href="#food" data-tab="food"><span class="ti" data-icon="food"></span>饮食</a>
      <a href="#body" data-tab="body"><span class="ti" data-icon="body"></span>身体</a>
    </div>
  </nav>
  <button class="fab" id="fab" type="button" hidden aria-label="快捷记录：补打卡、记一餐、记体重、记腰围体脂"><span class="ti" data-icon="plus"></span></button>
  <div id="sheet-root"></div>
</body>
</html>
