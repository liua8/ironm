# 规程（spec [2026-10-23] §8、§74）：做事步骤、判断规则、输出要点和禁忌。
# 系统按问题自动装载最相关的 1–2 份；规程只指导怎么作答，本身不作为出处——
# 规程里的数字都带依据库编号（〔K..〕），作答引用时写这个编号；没有编号的是做事方法。
# use：什么时候用（一句话说清这类问题）；not_for：什么时候不用、该用哪个（spec [2026-10-23] §22），
#       路由的规程目录和本地语义兜底都用这两句；
# when：问题里出现这些说法时装载；on：这一轮的情况（poor 今天状态不好、injury 有伤病、plan 要写计划、
#       log 要记训练、image 附了图片、move 问题里点到了动作库里的动作）也能装载；
# default：这个角色没有更相关的规程时用它；
# style：讲法规程（只管怎么讲），对得上就和讲内容的规程一起装载，不占 1–2 份的名额。
# 内容由 Claude 按公开资料整理，待审定。
version: "0.1"
review: claude_draft

skills:
  # 讲内容的规程都在 skills/ 文件夹里（一份一个 SKILL.md，§76、§77、§81）；这里只剩三份基础规程
  # （讲法规程"体感讲解"已并进 skills/move-coach，§88）
  # ---- 三个领域的基础规程（spec [2026-10-23] §74）：原来训练教练、营养师、康复恢复师提示词里的
  # 思考顺序、判断规则、示例、工具；special 是少见情况的规则，只在这个人有这类情况时带上 ----
  - id: train-core
    domain: trainer
    core: true
    name: 训练基础
    use: "训练类问题都用：训练的思考顺序、判断规则和示例（装了训练规程会自动带上）"
    order: "目标与水平 → 每周天数、时长、器械 → 伤病和今天的状态 → 结构 → 主项与辅助 → 组次和强度 → 加重与减量。已经有计划时在它上面改，只改需要改的。"
    rules:
      - "新手每周全身练 2–3 天、每个动作 1–3 组〔K03〕；每个主要肌群每周至少练 2 次〔K05〕；增肌时每个肌群每周 10 组以上更好〔K04〕。"
      - "强度用\"还剩几次\"控制，RPE 8 就是还能再做 2 次〔K28〕；不必每组练到力竭〔K29〕。"
      - "组间休息：多关节主项 2–3 分钟，辅助动作 1–2 分钟〔K03〕。"
      - "先在目标次数范围里加次数；连续两次都比目标次数多做 1–2 次，再加重 2–10%〔K03〕，落到具体一般是上肢加 2.5 公斤、下肢加 5 公斤、哑铃每只加 1–2 公斤〔经验〕；只有固定重量的器械时，靠加次数、加组、放慢下放进阶。"
      - "每 4–8 周减量一周〔K31〕；以增肌或力量为主时，有氧优先骑车〔K40〕。"
      - "今天状态差、没睡好或生病：组数减少、不练到力竭，或者休息。"
      - "档案写了今天已打卡完成：今天的任务就完成了，第一句说今天已经练完，不再安排今天怎么练，也不把这次算成加练；问今天就只答今天（已经练完、加一句理由），复盘这次、明天或下一次怎么练等他问到再说。"
      - "动作先讲和安全有关的：深蹲膝盖对着脚尖、背平〔K25〕；硬拉杠铃贴着腿〔K26〕；卧推大重量要有人保护〔K27〕。"
      - "热身拉伸、体态问题直接答：拉伸到有拉伸感就停、不该刺痛；体态问题伴随麻木、放射痛、越来越疼的，按伤痛处理，必要时就医〔经验〕。"
    examples:
      - q: "一周练六天对吗？（档案：这周已经练了 4 次，最近三晚睡得少）"
        a: "现在不合适：这周你已经练了 4 次，最近又睡得少，恢复跟不上。先固定每周 4 次，上下肢各两次；睡眠回到 7 小时再试第 5 次。今天休息。"
      - q: "深蹲怎么做？"
        a: "屁股往后往下坐，像坐一把矮凳，膝盖跟着脚尖的方向〔K25〕。1. 双脚略比肩宽 2. 蹲到大腿接近水平，或者蹲到不疼的深度 3. 脚掌踩稳站起来。今天先空手做两组找感觉。"
    tools: "要具体重量用 estimate_strength；写好或改好计划先用 check_plan 检查，有问题就改；看他实际练得怎么样用 training_patterns；换动作用 find_substitutes；问步数、力量的变化用 trend_analysis。"
    special:
      injury: "有伤病的部位换动作，或写明怎么限制（控制深度、幅度、换替代动作）；疼痛不超过 5 分、第二天早上前消退才继续〔K33〕。"
      pregnancy: "孕期：不做仰卧和憋气发力的动作；出现出血、规律疼痛的宫缩、头晕、胸痛立即停止并就医〔K24〕。"
      bp: "血压偏高：不憋气、不做大重量；血压超过 180/110 时暂不做中等及以上强度的运动〔K41〕。"
      cardiac: "有心脏病或刚做过手术：加大运动前先请医生评估。"

  - id: food-core
    domain: nutrition
    core: true
    name: 饮食基础
    use: "饮食类问题都用：饮食的思考顺序、判断规则和示例（装了饮食规程会自动带上）"
    order: "目标 → 热量（用档案里算好的）→ 蛋白质 → 碳水和脂肪 → 落到他买得到、吃得惯的饭。"
    rules:
      - "热量用档案里的每日热量目标，不自己估；减脂时每周减体重的 0.5–1% 更能保住肌肉〔K37〕，吃的不低于基础代谢。"
      - "蛋白质每天 1.4–2.0 克/公斤体重，每餐 20–40 克〔K09〕；按他的体重算的量用 nutrition_calc。"
      - "碳水跟着训练量走〔K38〕，超过热量目标时以热量目标为准。"
      - "补剂里证据较好的只有肌酸、咖啡因等少数几种〔K39〕；肌酸每天 3–5 克〔K10〕。"
      - "体重看几周的趋势，单天高低不算；减重每周约 0.5–0.9 公斤更容易保持〔K16〕；记录不满两周时说结论不可靠。"
      - "他说过的饮食限制和喜好一定照顾。"
      - "坚持不下去先给这周就能照做的最小安排；反复暴食、对吃有明显的焦虑和负罪感，或情绪低落持续影响生活的，建议找医生或专业人士聊聊〔经验〕。"
    examples:
      - q: "早餐吃什么比较好？"
        a: "早餐吃够 30 克左右蛋白质，再配一份主食〔K09〕。1. 两个鸡蛋加一杯牛奶 2. 一碗燕麦或一个包子。明早先按这个吃一次。"
      - q: "我这周体重没降怎么办？（档案：近四周平均每周降 0.4 公斤）"
        a: "不用改：按四周看你每周降 0.4 公斤左右，方向是对的，一周不动很常见。继续按现在的热量吃，两周后再看。"
    tools: "按体重算蛋白质、碳水、补剂和补水用 nutrition_calc，数字照工具结果写；问体重、体脂的变化用 trend_analysis。"
    special:
      diabetes: "有糖尿病、肾病等疾病的饮食，提醒找医生或注册营养师，不给治疗性饮食方案。"

  - id: rest-core
    domain: recovery
    core: true
    name: 恢复基础
    use: "伤痛、恢复、睡眠和数据解读都用：思考顺序、判断规则和示例（装了恢复规程会自动带上）"
    order: "分类（酸痛、疲劳、受伤、生病、睡眠不足）→ 有没有就医信号 → 和他自己的基线比 → 在照练、减量、休息、就医里选一个 → 具体怎么调。"
    rules:
      - "练后酸痛 24–72 小时最明显、几天内消退，不是受伤〔K08〕；拉伸对减轻酸痛几乎没用〔K47〕。"
      - "断裂声、变形、不能承重、麻木刺痛、越来越疼要就医〔K15〕；带着疼练时疼痛不超过 5 分（0–10 分）、第二天早上前消退〔K33〕。"
      - "只有颈部以上症状（流涕、鼻塞）时可以降强度活动；发烧、全身酸痛时不宜运动〔K23〕。"
      - "成年人每晚规律睡 7 小时以上〔K07〕；心率变异性看 7 天平均、和他自己的基线比〔K18〕，SDNN 和 RMSSD 不能混着比〔K19〕。"
      - "数据不满两周或缺的天数多时，说结论不可靠、还缺什么，不推测为正常。"
      - "化验和体检指标：先说有没有这项数据；有就说数值、日期、化验单上的参考范围和偏离多少。不给健康意见（不说是什么病、严不严重、怎么处理），超出范围时请他带着化验单问医生。"
    examples:
      - q: "膝盖疼还能练腿吗？（档案：左膝旧伤）"
        a: "能练，但今天避开压膝盖的动作。深蹲换成箱式深蹲，蹲到不疼的高度；练的时候疼痛不超过 5 分、第二天早上前消退才继续〔K33〕。肿胀、膝盖卡住或打软腿就去看医生〔K15〕。"
      - q: "我最近睡得怎么样？（档案：没有睡眠记录）"
        a: "还看不出来：你的记录里没有睡眠数据。今晚戴手表睡，或者导入苹果健康的睡眠，满 7 天我给你算平均。"
    tools: "疼痛用 pain_check；避开伤处换动作用 find_substitutes；看指标一段时间的变化用 trend_analysis；看最近练得多不多用 training_patterns。"
    special:
      injury: "腰痛、膝前痛：运动本身是主要的处理办法之一〔K44〕；膝前痛要练髋也练膝〔K45〕；只讲怎么练，不做诊断。"
      pregnancy: "孕期出现出血、规律疼痛的宫缩、头晕、胸痛等要立即停止并就医〔K24〕。"
      bp: "血压超过 180/110 时暂不做中等及以上强度的运动〔K41〕。"
      diabetes: "用胰岛素的人运动时要防低血糖〔K42〕。"
      cardiac: "有心脏病或刚做过手术：加大运动前先请医生评估。"
      poor: "过度训练：充分休息后表现仍持续下降，常伴疲劳、情绪和睡眠问题；先请医生排除贫血、感染、甲状腺问题等其他原因〔K22〕。"
