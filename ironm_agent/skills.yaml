# 各专业角色的规程（spec [2026-10-23] §8）：做事步骤、判断规则、输出要点和禁忌。
# 系统按问题自动装载最相关的 1–2 份；规程只指导怎么作答，本身不作为出处——
# 规程里的数字都带依据库编号（〔K..〕），作答引用时写这个编号；没有编号的是做事方法。
# use：什么时候用（一句话说清这类问题）；not_for：什么时候不用、该用哪个（spec [2026-10-23] §22），
#       路由的规程目录和本地语义兜底都用这两句；
# when：问题里出现这些说法时装载；on：这一轮的情况（poor 今天状态不好、injury 有伤病、plan 要写计划、
#       log 要记训练、image 附了图片、move 问题里点到了动作库里的动作）也能装载；
# default：这个角色没有更相关的规程时用它；
# style：讲法规程（只管怎么讲），对得上就和讲内容的规程一起装载，不占 1–2 份的名额。
# 内容由 Claude 按公开资料整理，待审定。
version: "0.1"
review: claude_draft

skills:
  # ---- 训练教练：计划 ----
  - id: plan-newbie
    role: trainer
    name: 新手入门
    use: 没怎么练过的人问从哪开始、第一份计划怎么练
    not_for: 有基础的人要增肌或提力量用「增肌」或「提升力量」
    when: [新手, 刚开始, 第一次练, 没练过, 入门, 零基础, 刚办卡]
    steps:
      - 每周 2–3 次全身训练〔K03〕，每次覆盖蹲、髋铰链（硬拉类）、推、拉、核心五类动作。
      - 先用轻重量学会动作：每组 8–12 次、1–3 组〔K03〕。
      - 重量按"做完还能再做 2–3 次"来定〔K28〕，动作稳定后再加重。
    rules:
      - 头几周先加次数、再加重量；动作变形就退回上一个重量。
    output:
      - 写清每周哪几天练、每次做哪些动作和组次，并说明怎么选重量。
    avoid:
      - 不安排大重量、力竭组和高难度的技术动作。
    refs: [K03, K28]

  - id: plan-muscle
    role: trainer
    name: 增肌
    use: 目标是长肌肉、练大某个部位，问怎么安排训练
    not_for: 增肌期怎么吃交给营养师（「增肌饮食」）
    when: [增肌, 长肌肉, 练大, 肌肥大, 围度, 练块]
    steps:
      - 每个肌群每周至少练 2 次〔K05〕，每周累计 10 组以上〔K04〕。
      - 每组练到接近力竭、留 1–2 次余力〔K29〕〔K28〕；较重或较轻的负荷都能增肌〔K30〕。
      - 能连续两次都比目标次数多做 1–2 次时再加重 2–10%〔K03〕。
    rules:
      - 多关节动作放在前面；同一肌群两次训练之间留出恢复。
      - 饮食配合：热量略有盈余、蛋白质吃够（交给营养）。
    output:
      - 写清每周几练、分化方式、每次的主项和组次。
    avoid:
      - 不要每组都练到力竭〔K29〕；不靠堆砌孤立动作凑训练量。
    refs: [K03, K04, K05, K28, K29, K30]

  - id: plan-strength
    role: trainer
    name: 提升力量
    use: 想提高某个动作的最大重量、冲重量，问怎么练
    not_for: 卡住很久没进步用「减量与平台期」
    when: [力量, 大重量, 1RM, 极限, 卧推多少, 深蹲多少, 提高重量, 冲重量]
    steps:
      - 主项以大重量、低次数为主〔K30〕，大动作组间休息 2–3 分钟〔K03〕。
      - 用"还剩几次"控制强度，主项多停在还能再做 1–2 次〔K28〕。
      - 每 4–8 周安排一次减量周〔K31〕。
    rules:
      - 力量的提高要靠逐步加重；每次只给一个变量加量。
    output:
      - 写清主项、辅助项、组次和加重规则。
    avoid:
      - 没有保护不做大重量卧推和深蹲；有伤病、血压偏高、今天状态差时不安排大重量和测极限。
    refs: [K03, K28, K30, K31]

  - id: plan-fatloss
    role: trainer
    name: 减脂期训练
    use: 减脂期问力量训练和有氧怎么安排、怎么少掉肌肉
    not_for: 减脂怎么吃交给营养师（「减脂饮食」）；只问跑步骑车怎么练用「有氧耐力」
    when: [减脂, 减肥, 瘦, 刷脂, 掉肌肉, 减重]
    steps:
      - 力量训练照常保持，重量尽量不降，用来保住肌肉〔K37〕。
      - 有氧作为补充，优先选骑车这类对力量干扰小的方式〔K40〕；日常多走路。
      - 每周减重控制在体重的 0.5–1%〔K37〕。
    rules:
      - 减脂靠饮食缺口为主（交给营养），训练负责保肌。
    output:
      - 写清每周力量几练、有氧几次、每次多久。
    avoid:
      - 不用大量有氧代替力量训练；每周减重别太快，约 0.5–0.9 公斤更容易长期保持〔K16〕。
    refs: [K16, K37, K40]

  - id: plan-home
    role: trainer
    name: 居家与时间有限
    use: 在家、器械少、时间短时问怎么练
    not_for: 只问某个动作没器械换什么用「替代动作选择」
    when: [在家, 家里, 没器械, 徒手, 只有哑铃, 弹力带, 时间少, 没时间, 半小时, 分钟, 出差, 酒店, 宿舍]
    steps:
      - 只用档案里他有的器械；没有器械时用自重和弹力带。
      - 时间短时保留多关节的主项，去掉孤立动作；可以把两个不同部位的动作交替做来省时间。
      - 器械不够重时，用单侧动作、放慢下放、多做几次到接近力竭来补强度〔K30〕。
    rules:
      - 先保证每周的次数，再追求每次的时长。
    output:
      - 写清每个动作用什么器械、做几组几次、大概多少分钟做完。
    avoid:
      - 不安排档案里没有的器械和场地；总时长不超过他能练的时间。
    refs: [K30]

  - id: plan-readiness
    role: trainer
    name: 按今天的状态调整
    use: 问今天练不练、练什么，或今天累、没睡好要怎么调整训练
    not_for: 只判断身体状态、不排训练的交给康复恢复师（「今天状态判断」）
    when: [累, 没睡好, 状态, 今天练什么, 还练吗, 能练吗, 酸痛, 熬夜, 睡了]
    on: [poor]
    default: true
    steps:
      - 先看档案里"今天的身体状态"和理由，按它调整，不要自己另编数据。
      - 状态差：重量减轻、组数减半，或改成轻松有氧、拉伸，或者休息；今晚优先补觉〔K35〕。
      - 状态一般：照计划练，但不冲重量，多留一两次余力〔K28〕。
      - 状态好或数据不足：按计划练；数据不足时不要说"状态好"。
    rules:
      - 有当前计划时，先说今天按计划练什么，再说怎么调整；档案写了今天已打卡完成时，只说今天已经练完，不再安排今天的训练；复盘和下一次等他问到再说。
    output:
      - 第一句说今天怎么练（照常 / 减量 / 休息），再给具体做法。
    avoid:
      - 状态差时不安排大重量、力竭、高强度间歇和冲刺。
    refs: [K28, K35]

  - id: plan-deload
    role: trainer
    name: 减量与平台期
    use: 练了一段时间重量上不去、练不动，问怎么突破或安排减量周
    not_for: 休息后表现仍持续下降、伴随疲劳和睡眠问题，交给康复恢复师（「过度训练」）
    when: [平台期, 练不动, 停滞, 没进步, 减量, 越练越累, 瓶颈]
    steps:
      - 先排查睡眠和饮食，长期疲劳、表现下降伴情绪和睡眠变差时要想到过度训练〔K22〕。
      - 安排一周减量：减少组数或降低用力程度〔K31〕，一般每 4–8 周一次〔K31〕。
      - 减量后换动作或调整次数范围〔K30〕，重新开始加量。
    rules:
      - 每次只改一个变量，观察两三周再判断。
    output:
      - 写清减量周怎么练、之后怎么调整。
    avoid:
      - 充分休息后表现仍持续下降，先就医排查其他原因〔K22〕。
    refs: [K22, K30, K31]

  - id: plan-return
    role: trainer
    name: 中断后回归
    use: 停练一段时间（放假、出差、忙）后回来，问怎么重新开始
    not_for: 因为受伤停练的用康复恢复师的「伤后回到训练」
    when: [好久没练, 很久没练, 停了, 中断, 断了, 重新开始练, 回来练, 又开始练, 放假回来, 出差回来, 停练]
    steps:
      - 先问停了多久、停之前练到什么程度、中间有没有受伤或生病（有伤交给康复恢复师判断）。
      - 降量回来：中断一两周按原来的约七成，更久按约一半（经验）；重量和组数一起降，动作先找回感觉。
      - 之后每周往回加一点，两三周内回到原来的量（经验），加量期间不练到力竭。
    rules:
      - 中断后的第一次训练第二天酸痛明显时，下一次不加量。
    output:
      - 写清这周每次练什么、按原来的几成、下周怎么加。
    avoid:
      - 不一回来就按原来的重量和组数练；不为了"补回来"加练。
    refs: []

  - id: plan-weekly
    role: trainer
    name: 排每周计划
    use: 要排一份每周计划，或改现有计划的某几天
    not_for: 只问今天练什么用「按今天的状态调整」
    when: [计划, 课表, 每周, 一周练, 排一下, 安排一下]
    on: [plan]
    steps:
      - 先看档案：目标、每周能练几天、每次多久、器械、伤病、今天的状态、当前计划。
      - 按天数选分化：每周 2–3 天练全身；4 天可以上下肢分开。每个肌群每周至少 2 次〔K05〕、10 组以上〔K04〕。
      - 每次五六个动作，多关节主项在前；有伤病的动作在备注里写明限制或换成替代动作。
      - 改计划时只改用户要求的部分，其余照抄；挪动一次训练时，避免同一部位连着两天练。
    rules:
      - 本周已经练过的不要重排；出差、时间少时减少天数，不把练不了的硬塞到别的天。
    output:
      - 计划写进 plan，文字只说思路和改了什么。
    avoid:
      - 不安排档案里没有的器械；每次时长不超过他能练的时间。
    refs: [K04, K05]

  # ---- 训练教练：动作 ----
  - id: move-teach
    role: trainer
    name: 动作教学
    use: 问某个动作怎么做、要点、常见错误怎么纠正
    not_for: 做动作时疼交给康复恢复师（「疼痛时怎么改动作」）；要换动作用「替代动作选择」
    when: [怎么做, 要点, 姿势, 标准, 发力, 动作, 纠正, 内扣, 弓背]
    steps:
      - 先查动作库里这个动作（做法、要点、常见错误、替代、什么情况先别做），引用时写动作库的编号。
      - 按准备、下放、起身的顺序讲三四个最关键的要点。
      - 指出最常见的一两个错误和怎么改；给出更容易和更难的替代。
    rules:
      - 只讲用户问的动作；有伤病时先说这个动作对他要怎么改。
    output:
      - 第一句给最关键的一点，再分步说。
    avoid:
      - 不讲用户没问的其他动作。
    refs: []

  - id: move-swap
    role: trainer
    name: 替代动作选择
    use: 没有器械、做不了某个动作，问可以换成什么
    not_for: 因为伤痛要换动作交给康复恢复师（「疼痛时怎么改动作」）
    when: [替代, 换个动作, 代替, 换成, 没有杠铃, 没有器械, 做不了]
    steps:
      - 在同一个动作模式（蹲、髋铰链、推、拉、核心）里选替代。
      - 按他有的器械选；有伤病时选对这个部位压力小的（查动作库的"更容易的替代"和"什么情况先别做"）。
    rules:
      - 给两三个替代，每个一句话说为什么适合他。
    output:
      - 按"最推荐的在前"列出。
    avoid:
      - 不推荐他没有的器械。
    refs: []

  - id: rest-pain
    role: recovery
    name: 疼痛时怎么改动作
    use: 做某个动作时或之后某个部位疼，问怎么改动作、还能不能练
    not_for: 听到断裂声、变形、麻木、肿得厉害用「就医信号」；只是练后普遍酸痛用「酸痛还是受伤」
    when: [疼, 痛, 不舒服, 响, 膝盖, 腰, 肩膀, 手腕, 脚踝]
    on: [injury]
    steps:
      - 只按已知信息说是哪里、什么动作疼；不判断是什么病。
      - 先改动作：减小幅度到不疼、减轻重量、换成替代动作（查动作库的"什么情况先别做"）。
      - 新出现、原因不明的疼痛：先停掉引起疼痛的动作，换成不疼的练法；已经看过医生、确认是慢性的小问题（如肌腱问题）时，才可以用 0–10 分记疼痛：练时不超过 5 分、第二天早上恢复、不逐周加重〔K33〕。
      - 膝盖前面疼：髋部和膝部的训练结合〔K45〕；腰痛：保持活动、轻重量、只做不疼的幅度〔K44〕。
    rules:
      - 写明出现什么情况必须停下就医。
    output:
      - 第一句说现在怎么改，最后一句写就医的信号。
    avoid:
      - 锐痛、肿胀、卡住、打软腿、麻木刺痛时停下就医〔K15〕；不诊断、不建议带着加重的疼痛硬练。
    refs: [K15, K33, K44, K45]

  - id: move-warmup
    role: trainer
    name: 热身
    use: 问练前怎么热身、做什么准备活动
    when: [热身, 激活, 准备活动, 练前做什么]
    steps:
      - 先做 5–10 分钟低到中等强度的有氧〔K06〕；热身能改善随后的运动表现〔K32〕。
      - 再做和主项一样的动作，用轻重量逐组加重到正式重量。
      - 静态拉伸放到练完以后；拉伸对防练后酸痛作用很小〔K47〕。
    rules:
      - 热身时间和强度按今天的训练内容定。
    output:
      - 按顺序列出热身步骤和大概时间。
    avoid:
      - 练前不做长时间的静态拉伸。
    refs: [K06, K32, K47]

  # 讲法规程（style）：只管怎么讲，问动作怎么做、或点到动作库里的动作时，和上面讲内容的规程一起装载，不占名额
  - id: move-feel
    role: trainer
    name: 体感讲解
    use: 讲动作要点时用身体感觉和类比讲（讲法规程）
    style: true
    on: [move]
    when: [怎么做, 怎么练, 发力, 要点, 姿势, 要领, 标准, 纠正, 什么感觉, 找不到感觉, 没感觉, 感受不到, 没看懂,
           看不懂, 听不懂, 大白话, 讲简单, 简单点, 打个比方, 比方, 通俗, 肩胛, 收紧, 内扣, 弓背, 塌腰, 耸肩, 借力]
    steps:
      - 每个关键要点都用身体感觉或生活里的类比来讲，不用解剖术语：不说"肩胛骨后缩下沉"，说"想象腋下夹着一张纸，别让它掉下来"。
      - 动作库里这个动作有"体感提示"时优先用；没有时参照下面的对照自己翻译。
      - 书面说法与该说的话对照（左边只给你对照，回答里不出现）：肩胛骨后缩下沉 → 两块肩胛骨像在背后夹住一支笔，再往裤兜方向塞；核心收紧、撑住腹压 → 肚子像要挨一拳那样绷住；屈髋、髋铰链 → 像用屁股去关身后的车门；伸髋、臀部发力 → 站直的最后一下像用屁股夹住一枚硬币；膝盖对准脚尖 → 膝盖像两盏车灯，一直照着脚尖的方向；离心控制 → 放下时像把一杯水轻轻放回桌上；脊柱中立 → 背上像放着一杯水，别让它洒出来；不耸肩 → 肩膀离耳朵远一点。
      - 肌肉名换成身体部位的说法：背阔肌 → 腋下到后腰那一大片；腘绳肌 → 大腿后面；臀大肌 → 屁股；股四头肌 → 大腿前面；竖脊肌 → 腰两侧那两条肉。
      - 说清楚做对时哪里该有感觉、哪里不该有（如"屁股和大腿后面发酸，腰不酸"）。
    rules:
      - 类比必须和正确动作一致；拿不准会不会让人做歪的就不用，直接说身体哪里该有什么感觉。
      - 用户自己用了术语时，接着用大白话讲那是什么感觉，不再重复术语。
      - 一个要点配一个类比，同一个要点不叠几个比方；每个要点都要讲到（如背要平、腰别弯），想不到合适的类比就用大白话直接说，不能省掉。
    output:
      - 每个要点写成"做什么 + 像什么"的一句话，能边听边照着做。
    avoid:
      - 不出现后缩、前伸、外旋、内旋、外展、内收、离心、向心、伸髋、屈髋、髋铰链、腘绳肌、竖脊肌这类术语。
      - 不堆砌比喻，不为了好懂改动作要领。
    refs: []

  - id: train-cardio
    role: trainer
    name: 有氧耐力
    use: 问跑步、骑车、游泳等有氧怎么练、练多久、多大强度
    not_for: 有氧怎么配合减脂饮食交给营养师
    when: [有氧, 跑步, 慢跑, 配速, 骑车, 单车, 游泳, 心率区间, 耐力, 跑多久, 跑多少, 椭圆机, 快走, 爬坡]
    steps:
      - 先看目的：健康、减脂、提高耐力，还是配合增肌力量。
      - 定每周总量：每周 150–300 分钟中等强度，或 75–150 分钟高强度，或两者组合〔K01〕。
      - 定强度：用"能说话但唱不了歌"或心率来区分中等和高强度〔K06〕；新手从中等强度、每次 20–30 分钟开始。
      - 和力量一起练时：跑步比骑车更影响增肌和力量〔K40〕，以增肌或力量为目标时，有氧优先选骑车，放在力量训练之后或另一天。
    rules:
      - 每次加量只加一样（时长、次数或强度），一周不超过原来的一成左右（经验）。
      - 有膝盖、脚踝问题时先选骑车、游泳、椭圆机这类冲击小的。
    output:
      - 写清每周几次、每次多久、什么强度、怎么判断强度对不对，以及和力量训练怎么排。
    avoid:
      - 不给没有依据的燃脂心率区间数字；不让新手一开始就天天高强度。
    refs: [K01, K06, K40]

  - id: train-habit
    role: trainer
    name: 坚持与习惯
    use: 说坚持不下去、没动力、没时间、总是中断训练
    not_for: 管不住嘴、饮食坚持不了交给营养师（「饮食坚持」）
    when: [坚持, 坚持不了, 坚持不下去, 没动力, 懒, 不想练, 三天打鱼, 总是放弃, 没时间, 太忙, 拖延, 断了, 又停了]
    steps:
      - 先问清卡在哪里：没时间、太累、没效果、不知道练什么，还是别的；不先给大道理。
      - 把目标降到"一定做得到"：比如每周两次、每次二十分钟，先连续做到一个月再加（经验）。
      - 绑定到固定的时间和场景：比如"周二周四下班换好衣服就去"，练前准备好衣服和计划。
      - 用打卡和每周复盘看到进步；中断了不补练、不惩罚，下一次照常回来。
    rules:
      - 计划太满导致坚持不了时，直接给一份更轻的安排，而不是劝他更努力。
      - 中断后回来先降量，别一回来就按原来的量练。
    output:
      - 第一句说最该先改的一件事，再给一份他这周就能照做的最小安排。
    avoid:
      - 不说教，不用"自律"指责他；情绪低落持续、影响生活时，建议找专业人士聊聊。
    refs: []

  # ---- 营养师 ----
  - id: food-targets
    role: nutrition
    name: 热量与蛋白质目标
    use: 问每天该吃多少热量、多少蛋白质
    not_for: 问具体怎么吃、吃什么用「增肌饮食」「减脂饮食」
    when: [吃多少, 热量, 蛋白质, 卡路里, 千卡, 摄入]
    default: true
    steps:
      - 直接用档案里的计算结果（热量目标、蛋白质目标），写上编号，不要自己重算。
      - 蛋白质每天 1.4–2.0 克/公斤体重〔K09〕，分 3–4 餐、每餐 20–40 克〔K36〕。
      - 两三周后按体重趋势微调。
    rules:
      - 档案里算不出来时，说清还缺什么（身高、出生日期、性别、目标、活动水平）。
    output:
      - 第一句给数，再说怎么分到三餐。
    avoid:
      - 建议的每日摄入不低于基础代谢和安全下限。
    refs: [K09, K36]

  - id: food-muscle
    role: nutrition
    name: 增肌饮食
    use: 增肌期问怎么吃、吃几顿、吃什么
    not_for: 只问一天吃多少克蛋白质或多少热量用「热量与蛋白质目标」
    when: [增肌, 增重, 长肌肉, 吃不胖, 练大]
    steps:
      - 用档案的热量目标（小幅盈余）和蛋白质目标。
      - 训练后两小时内吃一份优质蛋白〔K36〕；碳水按训练量吃，支撑训练〔K38〕。
    rules:
      - 优先吃天然食物，蛋白粉只是方便的补充。
    output:
      - 给一天三餐加练后的具体吃法。
    avoid:
      - 不靠高油高糖的食物堆热量。
    refs: [K36, K38]

  - id: food-fatloss
    role: nutrition
    name: 减脂饮食
    use: 减脂期问怎么吃、怎么安排三餐
    not_for: 只问一天吃多少热量用「热量与蛋白质目标」；总是管不住嘴用「饮食坚持」
    when: [减脂, 减肥, 瘦, 热量缺口, 掉秤, 刷脂]
    steps:
      - 用档案的热量目标；每周减重约为体重的 0.5–1%〔K37〕。
      - 蛋白质往高的一端吃，减脂期每天 2.3–3.1 克/公斤去脂体重〔K37〕，帮助保住肌肉。
      - 按平衡膳食搭配：蔬菜、水果、全谷物，控制油盐糖〔K17〕。
    rules:
      - 体重两三周不降再小幅减热量，不一次砍很多。
    output:
      - 给一天的吃法和最该改的一两个习惯。
    avoid:
      - 不建议低于基础代谢的吃法和极端节食；每周减重约 0.5–0.9 公斤更容易长期保持〔K16〕。
    refs: [K16, K17, K37]

  - id: food-timing
    role: nutrition
    name: 训练前后吃什么
    use: 问练前练后吃什么、什么时候吃、空腹练行不行
    when: [练前, 练后, 训练前, 训练后, 空腹, 睡前, 多久吃]
    steps:
      - 练前一到三小时吃一顿好消化的碳水加少量蛋白，离训练太近就只吃一点。
      - 练后两小时内吃优质蛋白，每次 20–40 克〔K36〕；睡前可以吃 30–40 克酪蛋白〔K36〕。
      - 持续 1–2.5 小时的运动中，每小时补 30–60 克碳水〔K38〕。
    rules:
      - 全天的总量比时间点更重要〔K36〕。
    output:
      - 给练前、练后各一个具体吃法。
    avoid:
      - 不把"练后马上吃"说成必须。
    refs: [K36, K38]

  - id: food-supplement
    role: nutrition
    name: 补剂评估
    use: 问某种补剂（肌酸、咖啡因、蛋白粉、维生素等）有没有用、怎么吃
    not_for: 只问一个名词是什么意思时不用规程
    when: [补剂, 肌酸, 咖啡, 咖啡因, 蛋白粉, 氮泵, 丙氨酸, 维生素, 鱼油, 营养品]
    steps:
      - 先看证据：有较好证据提高运动表现的只有少数〔K39〕。
      - 剂量照资料：肌酸〔K10〕、咖啡因〔K11〕、β-丙氨酸〔K43〕。
      - 选经过第三方检测认证的产品〔K39〕。
    rules:
      - 孕期、哺乳期、有慢病或在用药的人，吃补剂前先问医生或药师。
    output:
      - 第一句说有没有用、要不要吃，再给剂量和注意事项。
    avoid:
      - 不推荐没有证据的产品；不评估药物。
    refs: [K10, K11, K39, K43]

  - id: food-takeout
    role: nutrition
    name: 外卖与食堂怎么选
    use: 吃外卖、食堂、在外面吃饭时问怎么点、怎么选
    not_for: 聚餐应酬总是吃多、控制不住用「饮食坚持」
    when: [外卖, 食堂, 在外面吃, 应酬, 快餐, 点餐, 便利店]
    steps:
      - 先定一份优质蛋白：鱼、禽、蛋、瘦肉或豆制品〔K17〕。
      - 主食选全谷物或减半；加一份蔬菜〔K17〕。
      - 少选油炸、勾芡、浓酱汁的菜；控制盐〔K17〕。
    rules:
      - 给能直接照着点的例子。
    output:
      - 列两三个具体点法。
    avoid:
      - 不要求不现实的称重和计算。
    refs: [K17]

  - id: food-photo
    role: nutrition
    name: 看照片估算一餐
    use: 附了饭菜照片，要估算这一餐的热量和营养
    when: [照片, 图片, 这顿, 这餐, 拍了, 这些]
    on: [image]
    steps:
      - 认出每样食物和大致分量（参照碗、盘、手掌的大小）。
      - 分别估算热量和蛋白质，给一个范围，再加起来。
      - 写明是按照片估算，误差可能较大，油和酱料最容易估少。
      - 对照档案里的热量和蛋白质目标，说这一餐大概占多少、下一餐怎么补。
    rules:
      - 看不清的食物照实说看不清，不要猜成具体的菜。
    output:
      - 先给这一餐的总热量和蛋白质范围，再分项。
    avoid:
      - 不给精确到个位数的数字。
    refs: []

  - id: food-habit
    role: nutrition
    name: 饮食坚持
    use: 说管不住嘴、忍不住吃、暴食、饮食计划坚持不了
    not_for: 只问外卖或食堂怎么点用「外卖与食堂怎么选」
    when: [管不住嘴, 忍不住, 嘴馋, 暴食, 坚持不了, 太难坚持, 饿得受不了, 聚餐, 应酬, 节食, 破戒, 吃多了]
    steps:
      - 先问清在哪个时间、什么场景容易吃多：晚上、加班、聚餐、压力大。
      - 一次只改一两个习惯：比如每餐先吃够蛋白质和蔬菜、把零食换成水果和酸奶、晚饭定时。
      - 不靠饿：热量目标不低于基础代谢，每餐都有蛋白质，饿得受不了说明定得太低。
      - 吃多了一顿不用补偿性节食，下一顿照常吃。
    rules:
      - 聚餐和外卖给具体怎么点、怎么搭，而不是"少吃点"。
    output:
      - 第一句说最该先改的一个习惯，再给这周就能照做的两三条。
    avoid:
      - 不建议极低热量、断食硬扛；反复暴食、对吃有明显的焦虑或负罪感时，建议找医生或专业人士。
    refs: []

  # ---- 康复恢复师 ----
  - id: rest-readiness
    role: recovery
    name: 今天状态判断
    use: 问今天身体状态怎么样、能不能练、恢复得好不好
    not_for: 要排今天具体怎么练交给训练教练（「按今天的状态调整」）
    when: [状态, 恢复, 今天能练, 累, 疲劳, 心率变异性, 静息心率, 没睡好]
    on: [poor]
    default: true
    steps:
      - 用档案里"今天的身体状态"和理由，不要另编数据；和自己的基线比、看一周平均〔K18〕。
      - 好：照常练；一般：降低用力程度，多留余力〔K28〕；差：减量或休息、优先补觉〔K35〕。
    rules:
      - 数据不足时如实说，不说"状态好"。
    output:
      - 第一句给结论（照常 / 减量 / 休息），再说理由。
    avoid:
      - 不把单天的数字当成趋势。
    refs: [K18, K28, K35]

  - id: rest-sleep
    role: recovery
    name: 睡眠改善
    use: 问怎么睡得更好：失眠、早醒、睡不够、作息乱
    not_for: 问睡眠数据为什么没有或没记到用「数据缺失时怎么说」
    when: [睡眠, 睡不好, 失眠, 熬夜, 睡不着, 作息, 早醒]
    steps:
      - 成年人每晚规律地睡 7 小时以上〔K07〕；缺觉会影响肌肉合成〔K35〕。
      - 固定上床和起床时间，周末也一样；卧室安静、黑暗、温度舒适；睡前少用电子设备〔K34〕。
      - 睡前避免大餐、咖啡因和酒精，白天多活动〔K34〕。
    rules:
      - 先给最容易做到的一两条。
    output:
      - 第一句回答他问的，再给做法。
    avoid:
      - 不推荐安眠药；长期失眠、白天困得影响生活时就医。
    refs: [K07, K34, K35]

  - id: rest-soreness
    role: recovery
    name: 酸痛还是受伤
    use: 练后酸痛，分不清是正常酸痛还是受伤
    not_for: 做某个动作时疼、有明确的痛点用「疼痛时怎么改动作」
    when: [酸痛, 酸, 拉伤, 扭, 受伤, 第二天疼, 全身疼]
    steps:
      - 练后酸痛一般在训练后 24 小时左右出现，24–72 小时最明显，5–7 天内消退〔K08〕。
      - 酸痛期间同一肌群减少强度，可以练其他部位或做轻度活动〔K08〕；拉伸对减轻酸痛作用很小〔K47〕。
      - 受伤的信号：疼痛严重或越来越重、肿胀加重、听到断裂声、不能活动或承重、麻木刺痛〔K15〕。
    rules:
      - 分不清时按受伤处理，先停练这个部位。
    output:
      - 第一句说更像酸痛还是受伤、今天怎么练。
    avoid:
      - 有受伤信号时不建议继续练这个部位，要就医〔K15〕。
    refs: [K08, K15, K47]

  - id: rest-sick
    role: recovery
    name: 生病时练不练
    use: 感冒、发烧、咳嗽、拉肚子等生病时问能不能练
    when: [感冒, 发烧, 发热, 生病, 咳嗽, 嗓子疼, 拉肚子, 流鼻涕]
    steps:
      - 只有颈部以上的症状（流涕、鼻塞、轻微咽痛）时，通常可以降低强度活动〔K23〕。
      - 发烧、乏力、全身酸痛，或胸闷、咳嗽、胃肠不适时，不宜运动〔K23〕。
      - 病好后从低强度开始，慢慢回到原来的训练。
    rules:
      - 第一句直接说今天能不能练。
    output:
      - 给今天的做法和什么时候恢复训练。
    avoid:
      - 发烧时不运动；症状加重时就医。
    refs: [K23]

  - id: rest-overtraining
    role: recovery
    name: 过度训练
    use: 长期很累、休息后表现仍在下降，担心练过头
    not_for: 只是重量上不去、没有疲劳和睡眠问题交给训练教练（「减量与平台期」）
    when: [过度训练, 一直很累, 练不动, 成绩下降, 越练越累, 没劲]
    steps:
      - 过度训练的核心表现：充分休息后表现仍持续下降，常伴疲劳、情绪改变和睡眠障碍〔K22〕。
      - 先减量〔K31〕，保证睡眠和饮食，记录训练和状态〔K22〕。
    rules:
      - 判断为过度训练前，要请医生排除贫血、感染、甲状腺问题等原因〔K22〕。
    output:
      - 第一句说可能是什么情况、先怎么调整。
    avoid:
      - 不自行判断为过度训练后长期停练。
    refs: [K22, K31]

  - id: rest-return
    role: recovery
    name: 伤后回到训练
    use: 受伤或手术后，问什么时候、怎么回到训练
    not_for: 不是因为受伤、只是停练一段时间交给训练教练（「中断后回归」）
    when: [伤好了, 康复后, 受伤后, 恢复训练, 重新开始练, 回到训练, 能练了吗, 什么时候能练, 拆了石膏, 术后]
    on: [injury]
    steps:
      - 先确认医生或康复师的意见；手术或较重的伤，能不能回到训练由他和医疗人员一起决定〔K46〕。
      - 分三步回来：先恢复参与（不疼的日常活动和轻量练习）、再回到训练、最后回到原来的水平〔K46〕。
      - 每一步只在没有加重的情况下前进：练时疼痛不超过 5 分、第二天早上前消退、不逐周加重〔K33〕。
      - 告诉训练教练要避开或限制哪些动作，具体计划由训练教练来排。
    rules:
      - 受伤部位的动作单独减量，其他部位照常练。
      - 回到下一步的条件写成他能自己检查的标准（比如"上下楼不疼""单腿站稳不晃"）。
    output:
      - 第一句说他现在在哪一步、这周可以做什么；最后写出现什么情况要退回上一步或就医。
    avoid:
      - 不替医生判断伤好没好；不给固定的"几周后就能恢复"。
    refs: [K33, K46]

  - id: rest-redflag
    role: recovery
    name: 就医信号
    use: 问要不要去医院，或说了胸痛、心慌、麻木、肿得厉害这类危险信号
    when: [要不要去医院, 要看医生吗, 严重吗, 胸痛, 胸闷, 心慌, 晕倒, 喘不上气, 麻木, 刺痛, 肿得厉害, 断裂, 变形, 尿色]
    steps:
      - 先列出他说的情况里有没有立即就医的信号：听到断裂声、变形、不能活动或承重、麻木刺痛〔K15〕；运动中胸痛、头晕、心慌要立即停下。
      - 有就第一句写"现在停止运动，尽快就医"，并说去哪一科或拨打急救电话。
      - 没有立即就医的信号时，说清观察几天、什么情况要去看医生：越来越疼、肿胀加重、几天不见好〔K15〕。
    rules:
      - 只按他说的信息判断，不做诊断；拿不准时宁可建议就医。
    output:
      - 第一句给结论（立即就医 / 尽快就医 / 先观察），再写理由和要观察的信号。
    avoid:
      - 不说"应该没事"；不推荐药物。
    refs: [K15]

  # ---- 共享：数据解读（三个专业 Agent 都能装载，各自解读自己领域的指标）----
  - id: data-trend
    shared: true
    name: 趋势解读
    use: 问自己某项数据（体重、心率、睡眠、步数等）最近的变化、正常不正常
    not_for: 数据查不到、没记录用「数据缺失时怎么说」
    when: [趋势, 变化, 最近, 正常吗, 基线, 达标, 掉了, 涨了, 升高, 下降]
    on: [metric]
    steps:
      - 直接用档案里的计算结果（每周变化、和本人基线比、分级），写上编号，不要自己重算。
      - 和自己的基线比、看一周平均，不看单天〔K18〕。
      - 两种心率变异性要分开说：写出 SDNN 和 RMSSD 的名字，各自和自己的基线比，不互相比较〔K19〕。
      - 体重看每周变化和可信范围：范围跨过零就说变化不明显。
    rules:
      - 第一句给结论（正常、偏高、在下降、变化不明显），再给一两个数。
    output:
      - 结论和关键数字；最多再加一句和这个数字直接相关的提醒。
    avoid:
      - 不罗列所有指标；他没问怎么办时不扩展到训练和饮食安排；不把参考范围说成诊断。
    refs: [K18, K19]

  - id: data-labs
    shared: true
    name: 化验指标怎么看
    use: 问自己的化验、体检指标（肌酐、血糖、血脂、尿酸、转氨酶等）高不高、正常吗、怎么看
    not_for: 问体重、心率、睡眠这类每天的数据怎么变用「趋势解读」；疼痛、受伤用康复恢复师的伤痛规程
    when: [肌酐, 尿酸, 血糖, 血脂, 胆固醇, 甘油三酯, 转氨酶, 血红蛋白, 化验, 体检, 报告, 指标, 偏高, 偏低, 高吗, 正常吗]
    on: [lab]
    steps:
      - 第一句先回答他问的：有没有这项数据；有就说数值和日期，和化验单上的参考范围比是偏高、偏低还是在范围内，写上数据行编号。
      - 没有这项数据就如实说"没有找到你的…记录"，不推测高低；告诉他可以在数据页上传化验单或随手记一条。
      - 有多次记录时说最近一次和变化方向。
    rules:
      - 报告可以解读：说出本人的数值、参考范围（标准浮动范围）、偏高偏低和偏离多少，不算诊断。
      - 不给健康意见：不说这个数值对身体意味着什么、是不是某种病、严不严重、要怎么处理，不建议改药。
      - 超出参考范围、或伴有不适时，说偏离多少，请他带着化验单问医生。
    output:
      - 结论（有没有数据、高不高）和关键数字；最多再加一句和这项指标直接相关的提醒。
    avoid:
      - 他没问怎么办时，不扩展成训练和饮食安排；不把没有数据当作偏高或偏低。
    refs: []

  - id: data-missing
    shared: true
    name: 数据缺失时怎么说
    use: 问自己的数据但查不到、没记录、设备没记到
    not_for: 数据有、只问变化或正常不正常用「趋势解读」
    when: [没有数据, 没记录, 睡得怎么样, 多少步, 我的数据]
    steps:
      - 查不到就如实说"没有找到你的…记录"，不推断为正常，不编数字。
      - 说明怎么补：连接手表、导入苹果健康、上传报告、随手记一条。
    rules:
      - 有一部分数据时，只说有的那部分。
    output:
      - 第一句说有没有数据。
    avoid:
      - 不用别人的平均水平代替他的数据。
    refs: []
