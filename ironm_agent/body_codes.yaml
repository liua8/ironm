# 身体部位编码表（spec [2026-10-23] §57 需求 1）：部位 → 肌群 → 细分肌肉，关节单独一层挂在部位下。
# 用户说的、动作库标的、人体图画的、说疼记的，最后都落到这里的编码上；能定到哪层就用最细的那层。
#
# code：编码，发布后不改不删；level：part 部位、group 肌群、muscle 细分肌肉、joint 关节
# parent：唯一上级（肌群挂部位、细分肌肉挂肌群、关节挂部位）
# name：页面和回答里显示的常用名；formal：中文正式名（按全国科学技术名词审定委员会《人体解剖学名词》，和常用名一样时不写）
# fedb：开放动作库 free-exercise-db 的肌群名（它的 abductors 不单列，当作臀中肌的说法）
# uberon：国际解剖本体 UBERON 的编号（经 EBI OLS 检索核对；没有一一对应的不填）
# model：3D 人体图模型（Z-Anatomy 健身改造版）里对应的分区名，一块肌肉可以对应几个分区；只有细分肌肉写
# says：常见说法。同一个说法只能指一个编码；只有肌群和它唯一的同名细分肌肉可以同名，查的时候落到细分肌肉
# 说法由 Claude 整理，待审定。
version: "0.1"
review: claude_draft

